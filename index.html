<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRG39 - Zugvorschau</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --track-color: #333;
            --resizer-color: #ccc;
            --signal-red: #ff4c4c;
            --signal-green: #4cff4c;
            --preview-scale: 1;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        #stellwerk-area {
            height: 50vh;
            min-height: 100px;
            background-color: #e8e8e8;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #stellwerk-controls {
            padding: 5px 20px;
            background-color: #d0d0d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid #bbb;
        }

        #stellwerk-content {
            flex-grow: 1;
            transform-origin: top left;
            position: relative;
            overflow: auto; /* Allow scrolling if zoomed */
        }

        #resizer-top {
            height: 10px;
            background-color: var(--resizer-color);
            cursor: ns-resize;
            border-top: 1px solid #aaa;
            border-bottom: 1px solid #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        #resizer-top::before {
            content: "|||";
            font-size: 8px;
            color: #666;
            transform: rotate(90deg);
            letter-spacing: 1px;
        }

        #main-area {
            flex: 1 1 0;
            background-color: #ffffff;
            min-height: 50px;
            display: flex;
        }

        #four-cols-container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff;
        }

        .col-pane {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
        }

        .col-resizer {
            width: 10px;
            background-color: var(--resizer-color);
            cursor: ew-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            border-left: 1px solid #aaa;
            border-right: 1px solid #aaa;
        }

        .col-resizer::before {
            content: "|||";
            font-size: 8px;
            color: #666;
            letter-spacing: 1px;
        }

        .col-header {
            background-color: #d0d0d0;
            border-bottom: 1px solid #bbb;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .col-header-row1 {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            gap: 5px;
            min-height: 28px;
            white-space: nowrap;
            overflow: hidden;
        }

        .col-header-row1.space-between { justify-content: space-between; }
        .col-header-row1.flex-end      { justify-content: flex-end; }
        .col-header-row1.center        { justify-content: center; }

        .col-header-row2 {
            display: flex;
            align-items: center;
            padding: 3px 6px;
            gap: 4px;
            border-top: 1px solid #bbb;
            background-color: #d8d8d8;
            min-height: 24px;
        }

        .col-header-row2.flex-end { justify-content: flex-end; }

        .col-tab {
            padding: 3px 8px;
            background-color: #e8e8e8;
            border: 1px solid #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-weight: normal;
            font-size: 13px;
        }

        .col-tab.active {
            background-color: #fff;
            border-color: #888;
            font-weight: bold;
            box-shadow: 0 0 4px rgba(0,0,0,0.1);
        }

        .col-content {
            flex-grow: 1;
            background-color: #fff;
            overflow: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        #col3-map {
            width: 100%;
            height: 100%;
        }

        /* Gattung filter buttons */
        .gat-btn {
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #aaa;
            cursor: pointer;
            background: #eee;
            font-weight: bold;
        }
        .gat-btn:hover { filter: brightness(0.9); }
        .gat-btn.active { outline: 2px solid #333; }
        .gat-fd  { color: #800080; }
        .gat-d   { color: #d32f2f; }
        .gat-e   { color: #1976d2; }
        .gat-p   { color: #555; }

        .station-filter-input {
            font-size: 12px;
            border: 1px solid #aaa;
            border-radius: 3px;
            padding: 1px 4px;
            width: 80px;
            flex-shrink: 1;
            min-width: 40px;
        }

        .fahrplan-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .fahrplan-table th, .fahrplan-table td {
            border-bottom: 1px solid #ccc;
            padding: 4px;
            text-align: left;
        }
        
        .fahrplan-table th {
            background-color: #f0f0f0;
            position: sticky;
            top: -10px;
            z-index: 5;
        }
        
        .fahrplan-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .fahrplan-table tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        .fahrplan-table tbody tr {
            cursor: pointer;
        }

        .fahrplan-table tbody tr:hover {
            background-color: #e6f7ff !important;
        }

        .fahrplan-table tbody tr.selected {
            background-color: #cceeff !important;
        }
        
        .fahrplan-table tbody tr.next-train {
            background-color: #fffacd !important;
        }

        .fahrplan-table tbody tr.next-train.selected {
            background-color: #cceeff !important; /* Selection overrides next-train color */
        }

        .gattung-fd { color: #800080; } /* Lila */
        .gattung-d { color: #d32f2f; } /* Rot */
        .gattung-e { color: #1976d2; } /* Blau */

        #resizer {
            height: 10px;
            background-color: var(--resizer-color);
            cursor: ns-resize;
            border-top: 1px solid #aaa;
            border-bottom: 1px solid #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #resizer::before {
            content: "|||";
            font-size: 8px;
            color: #666;
            transform: rotate(90deg);
            letter-spacing: 1px;
        }

        #preview-area {
            height: 250px;
            min-height: 100px;
            background-color: #e0e0e0;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #controls-bar {
            padding: 5px 20px;
            background-color: #d0d0d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid #bbb;
        }
        .controls-left, .controls-right {
            display: flex;
            gap: 15px;
            align-items: center;
            flex: 1;
        }
        .controls-right {
            justify-content: flex-end;
        }
        .controls-center {
            display: flex;
            gap: 25px;
            align-items: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .clock-part {
            cursor: ns-resize;
            display: inline-block;
            padding: 0 2px;
            border-radius: 3px;
        }
        .clock-part:hover {
            background-color: rgba(0,0,0,0.1);
        }
        .fw-bold {
            font-weight: bold;
        }

        #tracks-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 20px 0 70px 0;
        }

        .track-container {
            position: relative;
            width: 100%;
            height: calc(60px * var(--preview-scale)); /* Space for train */
        }

        .track {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 3px;
            background-color: var(--track-color);
        }

        /* Signals */
        .signal {
            position: absolute;
            bottom: -13.5px; /* Centered on track (track is 3px at bottom 0, signal is 30px high) */
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 20;
            clip-path: polygon(100% 50%, 0 0, 0 100%);
            transition: background-color 0.3s;
        }

        #signal-top {
            left: 50px;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }

        #signal-bottom {
            right: 50px;
            clip-path: polygon(100% 50%, 0 0, 0 100%);
        }

        .halt { background-color: var(--signal-red); }
        .fahrt { background-color: var(--signal-green); }

        /* Route Labels & Countdowns */
        .route-label {
            position: absolute;
            bottom: -20px;
            font-size: 12px;
            color: #333;
            font-weight: 500;
            white-space: nowrap;
        }
        .countdown-label {
            position: absolute;
            bottom: -20px;
            font-size: 12px;
            color: #555;
            font-weight: bold;
            font-style: italic;
            white-space: nowrap;
        }
        /* Top track: apex at left:80px — route to the right, countdown to the left */
        #route-top {
            left: 96px;
            text-align: left;
        }
        #countdown-top {
            right: calc(100% - 64px);
            text-align: right;
        }
        /* Bottom track: apex at right:80px — route to the left, countdown to the right */
        #route-bottom {
            right: 96px;
            text-align: right;
        }
        #countdown-bottom {
            left: calc(100% - 64px);
            text-align: left;
        }


        .sig-gat-fd { color: #800080; }
        .sig-gat-d  { color: #d32f2f; }
        .sig-gat-e  { color: #1976d2; }
        .sig-gat-p  { color: #222; }

        /* Zugstandort-Indikator im Laufweg */
        @keyframes pulse-dot {
            0%   { transform: scale(1);   opacity: 1; }
            50%  { transform: scale(1.7); opacity: 0.5; }
            100% { transform: scale(1);   opacity: 1; }
        }
        .zug-pos-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e53935;
            vertical-align: middle;
            margin-right: 5px;
            flex-shrink: 0;
        }
        .zug-pos-dot.pulsing {
            animation: pulse-dot 1.2s ease-in-out infinite;
        }

        /* Trains */
        .train {
            position: absolute;
            bottom: 3px; /* On track (track is 3px high) */
            display: flex;
            align-items: flex-end;
            white-space: nowrap;
            z-index: 10; /* Behind signals (z-index 20) */
        }

        .vehicle {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            position: absolute;
            top: 100%;
            padding-top: 5px;
            font-size: calc(10px * var(--preview-scale));
            color: #555;
            white-space: nowrap;
            display: none;
        }

        body.show-info .info-label {
            display: block;
        }

        .train img {
            height: calc(40px * var(--preview-scale)); /* Adjust based on image aspect ratio later */
            display: block;
            margin: 0;
            padding: 0;
            object-fit: contain;
            object-position: bottom;
        }

        /* Top train goes left */
        #train-top {
            transform-origin: center bottom;
        }

    </style>
</head>
<body>

    <div id="stellwerk-area">
        <div id="stellwerk-controls">
            <div style="flex: 1; display: flex; align-items: center;"><strong>Stellwerk</strong></div>
            <div style="flex: 1; display: flex; justify-content: center;">
                <button id="fullscreen-btn" style="padding: 3px 12px; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; background: #e8e8e8;">Vollbild</button>
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center;">
                <label>Zoom: <input type="range" id="stellwerk-zoom" min="0.1" max="3" step="0.1" value="1"></label>
            </div>
        </div>
        <div id="stellwerk-content">
            <!-- Stellwerk Inhalt -->
        </div>
    </div>
    <div id="resizer-top"></div>
    <div id="main-area">
        <div id="four-cols-container">
            <!-- Bereich 1: v/n Halle (Ankunft) -->
            <div class="col-pane" id="col1">
                <div class="col-header">
                    <div class="col-header-row1 space-between">
                        <span>&larr; nach Halle</span>
                    </div>
                    <div class="col-header-row2" id="filter-row-1"></div>
                </div>
                <div class="col-content"></div>
            </div>
            <div class="col-resizer" id="res1"></div>
            <!-- Bereich 2: Laufweg/Zp links -->
            <div class="col-pane" id="col2">
                <div class="col-header">
                    <div class="col-header-row1">
                        <span class="col-tab active" data-tab="laufweg" onclick="switchTab(2, 'laufweg')">Laufweg</span>
                        <span class="col-tab" data-tab="zp" onclick="switchTab(2, 'zp')">Zp</span>
                        <span id="info-col2" style="font-weight:normal;font-size:12px;color:#444;margin-left:6px;white-space:nowrap;overflow:hidden;"></span>
                    </div>
                </div>
                <div class="col-content"></div>
            </div>
            <div class="col-resizer" id="res2"></div>
            <!-- Bereich 3: Karte -->
            <div class="col-pane" id="col3">
                <div class="col-header">
                    <div class="col-header-row1 center"><strong>Karte</strong></div>
                </div>
                <div class="col-content" style="padding:0;">
                    <div id="col3-map"></div>
                </div>
            </div>
            <div class="col-resizer" id="res3"></div>
            <!-- Bereich 4: Laufweg/Zp rechts -->
            <div class="col-pane" id="col4">
                <div class="col-header">
                    <div class="col-header-row1 flex-end">
                        <span id="info-col4" style="font-weight:normal;font-size:12px;color:#444;margin-right:6px;white-space:nowrap;overflow:hidden;"></span>
                        <span class="col-tab" data-tab="zp" onclick="switchTab(4, 'zp')">Zp</span>
                        <span class="col-tab active" data-tab="laufweg" onclick="switchTab(4, 'laufweg')">Laufweg</span>
                    </div>
                </div>
                <div class="col-content"></div>
            </div>
            <div class="col-resizer" id="res4"></div>
            <!-- Bereich 5: v/n Ahb (Abfahrt) -->
            <div class="col-pane" id="col5">
                <div class="col-header">
                    <div class="col-header-row1 flex-end">
                        <span>nach Ahb &rarr;</span>
                    </div>
                    <div class="col-header-row2 flex-end" id="filter-row-5"></div>
                </div>
                <div class="col-content"></div>
            </div>
        </div>
    </div>
    <div id="resizer"></div>
    <div id="preview-area">
        <div id="controls-bar">
            <div class="controls-left">
                <label><input type="radio" name="view-mode" value="schematic" checked> Schematisch</label>
                <label><input type="radio" name="view-mode" value="real"> Realzug</label>
                <label><input type="radio" name="view-mode" value="model"> Modellzug</label>
            </div>
            
            <div class="controls-center">
                <select id="station-select" style="margin-right: 15px; font-size: 14px; padding: 2px;">
                    <option value="Berlin Anhalter Bf">Berlin Anhalter Bf</option>
                    <option value="Berlin-Lichterfelde Ost" selected>Berlin-Lichterfelde Ost</option>
                </select>
                <div id="clock-widget" style="display: flex; align-items: center; gap: 5px;">
                    <svg id="icon-clock" style="cursor: pointer;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span><span class="clock-part fw-bold" id="clock-h">12</span>.<span class="clock-part fw-bold" id="clock-m">00</span>:<span class="clock-part" id="clock-s">00</span></span>
                </div>
                <div id="multiplier-widget" style="display: flex; align-items: center; gap: 5px;">
                    <svg id="icon-mul" style="cursor: pointer;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon></svg>
                    <span>Faktor <span class="clock-part" id="mul-container">1:<span id="clock-mul">1</span></span></span>
                </div>
            </div>

            <div class="controls-right">
                <label><input type="checkbox" id="info-checkbox" checked> Wageninformation</label>
            </div>
        </div>
        <div id="tracks-area">
            <div class="track-container" id="track-top-container">
                <div id="countdown-top" class="countdown-label"></div>
                <div class="track"></div>
                <div id="signal-top" class="signal halt"></div>
                <div id="route-top" class="route-label"></div>
                <div id="train-top" class="train"></div>
                <div id="rangierlok-top" class="train" style="display:none;"></div>
                <div id="zuglok-top" class="train" style="display:none;"></div>
            </div>
            
            <div class="track-container" id="track-bottom-container">
                <div id="countdown-bottom" class="countdown-label"></div>
                <div class="track"></div>
                <div id="signal-bottom" class="signal fahrt"></div>
                <div id="route-bottom" class="route-label"></div>
                <div id="train-bottom" class="train"></div>
                <div id="rangierlok-bottom" class="train" style="display:none;"></div>
                <div id="zuglok-bottom" class="train" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Clock Logic ---
        let simTime = new Date();
        let clockH = simTime.getHours();
        let clockM = simTime.getMinutes();
        let clockS = simTime.getSeconds();
        let timeMul = 1;

        function updateClockDisplay() {
            document.getElementById('clock-h').textContent = String(clockH).padStart(2, '0');
            document.getElementById('clock-m').textContent = String(clockM).padStart(2, '0');
            document.getElementById('clock-s').textContent = String(clockS).padStart(2, '0');
            document.getElementById('clock-mul').textContent = timeMul;
            if (typeof window.autoSelectNextTrain === 'function') {
                window.autoSelectNextTrain();
            }
            if (typeof window.updateSignalTrainInfo === 'function') {
                window.updateSignalTrainInfo();
            }
        }
        updateClockDisplay();

        function attachScrollHandler(id, callback) {
            document.getElementById(id).addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = Math.sign(e.deltaY);
                callback(delta < 0 ? 1 : -1);
                updateClockDisplay();
            });
        }

        attachScrollHandler('clock-h', (change) => {
            clockH = (clockH + change + 24) % 24;
        });
        attachScrollHandler('clock-m', (change) => {
            clockM = (clockM + change + 60) % 60;
        });
        attachScrollHandler('clock-s', (change) => {
            clockS = (clockS + change + 60) % 60;
        });
        attachScrollHandler('mul-container', (change) => {
            timeMul += change;
            if (timeMul < 1) timeMul = 1;
            if (timeMul > 20) timeMul = 20;
        });

        document.getElementById('icon-clock').addEventListener('click', () => {
            const now = new Date();
            clockH = now.getHours();
            clockM = now.getMinutes();
            clockS = now.getSeconds();
            updateClockDisplay();
        });

        document.getElementById('icon-mul').addEventListener('click', () => {
            timeMul = 2;
            updateClockDisplay();
        });

        let lastTime = performance.now();
        let remainderMs = 0;

        function tickSimulation(now) {
            const deltaMs = now - lastTime;
            lastTime = now;
            
            remainderMs += deltaMs * timeMul;
            
            if (remainderMs >= 1000) {
                const secsToadd = Math.floor(remainderMs / 1000);
                remainderMs -= secsToadd * 1000;
                
                clockS += secsToadd;
                if (clockS >= 60) {
                    clockM += Math.floor(clockS / 60);
                    clockS = clockS % 60;
                }
                if (clockM >= 60) {
                    clockH = (clockH + Math.floor(clockM / 60)) % 24;
                    clockM = clockM % 60;
                }
                updateClockDisplay();
            }
            requestAnimationFrame(tickSimulation);
        }
        requestAnimationFrame(tickSimulation);

        // --- Unified Mouse Handlers for all resizers ---
        let isResizingTop = false;
        let isResizingBottom = false;
        let isResizingCol = false;

        const resizerTop = document.getElementById('resizer-top');
        const stellwerkArea = document.getElementById('stellwerk-area');

        resizerTop.addEventListener('mousedown', (e) => {
            isResizingTop = true;
            document.body.style.cursor = 'ns-resize';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (isResizingTop) {
                const newHeight = e.clientY;
                if (newHeight > 50 && newHeight < window.innerHeight - 100) {
                    stellwerkArea.style.height = newHeight + 'px';
                    if (window._orm_map) window._orm_map.invalidateSize();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            if (isResizingTop) {
                isResizingTop = false;
                document.body.style.cursor = 'default';
            }
        });

        // --- Stellwerk Zoom Logic ---
        const stellwerkZoom = document.getElementById('stellwerk-zoom');
        const stellwerkContent = document.getElementById('stellwerk-content');
        stellwerkZoom.addEventListener('input', (e) => {
            const scale = e.target.value;
            stellwerkContent.style.transform = `scale(${scale})`;
        });

        // --- 5 Columns Logic ---
        // Layout: col1 | res1 | col2 | res2 | col3(Karte) | res3 | col4 | res4 | col5
        // Symmetry: col1=col5 (outer pair), col2=col4 (inner pair), col3(Karte) absorbs.
        const _c1 = document.getElementById('col1');
        const _c2 = document.getElementById('col2');
        const _c3 = document.getElementById('col3');
        const _c4 = document.getElementById('col4');
        const _c5 = document.getElementById('col5');
        const _r1 = document.getElementById('res1');
        const _r2 = document.getElementById('res2');
        const _r3 = document.getElementById('res3');
        const _r4 = document.getElementById('res4');

        let a1 = 15, a2 = 20, a3 = 30, a4 = 20, a5 = 15; // percentages (a3 = Karte)

        function updateCols() {
            _c1.style.width = a1 + '%';
            _c2.style.width = a2 + '%';
            _c3.style.width = a3 + '%';
            _c4.style.width = a4 + '%';
            _c5.style.width = a5 + '%';
        }
        updateCols();

        let activeColResizer = null;
        let colStartX = 0;
        let sa1, sa2, sa3, sa4, sa5;

        function startColResize(e, id) {
            activeColResizer = id;
            colStartX = e.clientX;
            sa1 = a1; sa2 = a2; sa3 = a3; sa4 = a4; sa5 = a5;
            document.body.style.cursor = 'ew-resize';
            e.preventDefault();
        }

        _r1.addEventListener('mousedown', e => startColResize(e, 'r1'));
        _r2.addEventListener('mousedown', e => startColResize(e, 'r2'));
        _r3.addEventListener('mousedown', e => startColResize(e, 'r3'));
        _r4.addEventListener('mousedown', e => startColResize(e, 'r4'));

        window.addEventListener('mousemove', e => {
            if (!activeColResizer) return;
            const cw = document.getElementById('four-cols-container').clientWidth;
            const d = ((e.clientX - colStartX) / cw) * 100;
            const MIN = 5;

            if (activeColResizer === 'r1') {
                // outer-left: a1 & a5 grow/shrink symmetrically, a3 absorbs
                let n1 = Math.max(MIN, Math.min(sa1 + d, 40));
                let n3 = 100 - 2 * n1 - 2 * sa2;
                if (n3 >= MIN) { a1 = n1; a5 = n1; a3 = n3; }
            } else if (activeColResizer === 'r4') {
                // outer-right: mirror of r1 (moving right shrinks a5)
                let n5 = Math.max(MIN, Math.min(sa5 - d, 40));
                let n3 = 100 - 2 * n5 - 2 * sa2;
                if (n3 >= MIN) { a5 = n5; a1 = n5; a3 = n3; }
            } else if (activeColResizer === 'r2') {
                // inner-left: a2 & a4 grow/shrink symmetrically, a3 absorbs
                let n2 = Math.max(MIN, Math.min(sa2 + d, 35));
                let n3 = 100 - 2 * sa1 - 2 * n2;
                if (n3 >= MIN) { a2 = n2; a4 = n2; a3 = n3; }
            } else if (activeColResizer === 'r3') {
                // inner-right: mirror of r2 (moving right shrinks a4)
                let n4 = Math.max(MIN, Math.min(sa4 - d, 35));
                let n3 = 100 - 2 * sa1 - 2 * n4;
                if (n3 >= MIN) { a4 = n4; a2 = n4; a3 = n3; }
            }
            updateCols();
            if (window._orm_map) window._orm_map.invalidateSize();
        });

        window.addEventListener('mouseup', () => {
            if (activeColResizer) {
                activeColResizer = null;
                document.body.style.cursor = 'default';
                if (window._orm_map) window._orm_map.invalidateSize();
            }
        });

        // --- OpenRailwayMap (Leaflet) ---
        // Berlin Anhalter Bf: 52.5029N, 13.3826E
        // We want it horizontally centered and at ~20% from the top ("oben")
        const ORM_LAT = 52.5029, ORM_LNG = 13.3826;
        const ORM_ZOOM = 14;

        function initMap() {
            const mapEl = document.getElementById('col3-map');
            if (!mapEl || window._orm_map) return;

            const map = L.map('col3-map', {
                center: [ORM_LAT, ORM_LNG],
                zoom: ORM_ZOOM,
                zoomControl: true
            });
            window._orm_map = map;

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            L.tileLayer('https://{s}.tile.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openrailwaymap.org">OpenRailwayMap</a>',
                maxZoom: 19,
                opacity: 0.8
            }).addTo(map);

            // After tiles load, pan so station appears at ~20% from top ("oben")
            map.whenReady(() => {
                const mapH = mapEl.clientHeight;
                // Station is at center (50%). We want it at 20% from top.
                // Pan DOWN by 30% of map height to push station UP.
                map.panBy([0, Math.round(mapH * 0.3)], { animate: false });
            });
        }

        // Init map after layout settles
        setTimeout(initMap, 300);


        // --- Resizer Logic ---
        const resizer = document.getElementById('resizer');
        const previewArea = document.getElementById('preview-area');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'ns-resize';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const newHeight = window.innerHeight - e.clientY;
            if (newHeight > 100 && newHeight < window.innerHeight - 50) {
                previewArea.style.height = newHeight + 'px';
                const scale = newHeight / 250;
                document.documentElement.style.setProperty('--preview-scale', scale);
                train1.updateWidth();
                train2.updateWidth();
                if (window._orm_map) window._orm_map.invalidateSize();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
            }
        });

        // --- Signal Logic ---
        const signalTop = document.getElementById('signal-top');
        const signalBottom = document.getElementById('signal-bottom');

        let signalTopState = 'halt'; // 'halt' or 'fahrt'
        let signalBottomState = 'fahrt';

        signalTop.addEventListener('click', () => {
            signalTopState = signalTopState === 'halt' ? 'fahrt' : 'halt';
            signalTop.className = `signal ${signalTopState}`;
        });

        signalBottom.addEventListener('click', () => {

            signalBottom.className = `signal ${signalBottomState}`;
        });

        const infoCheckbox = document.getElementById('info-checkbox');
        infoCheckbox.addEventListener('change', (e) => {
            if(e.target.checked) {
                document.body.classList.add('show-info');
            } else {
                document.body.classList.remove('show-info');
            }
        });
        // Ensure default state is active on load
        infoCheckbox.checked = true;
        document.body.classList.add('show-info');

        document.querySelectorAll('input[name="view-mode"]').forEach(radio => {
            radio.addEventListener('change', () => {
                if (typeof window.updateSignalTrainInfo === 'function') {
                    // force redraw of trains
                    document.getElementById('train-top').dataset.zugNr = '';
                    document.getElementById('train-bottom').dataset.zugNr = '';
                    window.updateSignalTrainInfo();

        function renderSchematicTrain(container, z, isTopTrack) {
            container.innerHTML = '';
            container.style.gap = '5px';
            container.style.bottom = '5px'; // leichter Abstand zum Gleis
            
            if (!isTopTrack) {
                 container.style.flexDirection = 'row-reverse';
            } else {
                 container.style.flexDirection = 'row';
            }

            const zpList = (window._zpaMap && window._zpaMap[z.rawZugNr]) || [];
            
            if (zpList.length === 0) return;

            // Lokomotive am Anfang
            const lokDiv = document.createElement('div');
            lokDiv.className = 'vehicle';
            const lokImg = document.createElement('img');
            lokImg.src = './data/img/pwagen/lok.png';

                // Wenn der Zug nach rechts fährt, muss nur die Lok gespiegelt werden

                // Step 2: strip from "ue", "ü", "?", "i" or "-" onwards (e.g. "C4ü" -> "C4", "AB4ue" -> "AB4", "Pw4i" -> "Pw4")
                baseName = baseName.split(/ue|ü|\?|-|(?<=[0-9])[a-z]/i)[0];
                // Step 3: ensure we have a valid non-empty string
                if (!baseName) baseName = 'Unbekannt';
                img.src = `./data/img/pwagen/${baseName}.png`;
                img.onerror = function() { 
                    this.onerror = null; 
                    this.src = './data/img/pwagen/Unbekannt.png'; 
                };

                label.textContent = wagen.gattung;

        // Train animation logic is now integrated into updateSignalTrainInfo() based on scheduled time.

        // --- Fullscreen Logic ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        // --- Tab State ---
        const tabState = { 2: 'laufweg', 4: 'laufweg' };
        window.switchTab = function(area, tabName) {

            const colId = area === 2 ? 'col2' : 'col4';
