        // --- Fahrplan Logic ---
        async function loadFahrplan() {
            try {
                const [zuegeRes, abfahrtenRes, zpaRes] = await Promise.all([
                    fetch('data/fahrplan/zuege.csv'),
                    fetch('data/fahrplan/abfahrten.csv'),
                    fetch('data/fahrplan/zpa.csv')
                ]);
                
                if (!zuegeRes.ok || !abfahrtenRes.ok || !zpaRes.ok) {
                    throw new Error("Fahrplandaten konnten nicht geladen werden.");
                }

                // Decode as ISO-8859-1 / Windows-1252 to fix Umlauts
                const decoder = new TextDecoder('windows-1252');
                const zuegeBuffer = await zuegeRes.arrayBuffer();
                const abfahrtenBuffer = await abfahrtenRes.arrayBuffer();
                const zpaBuffer = await zpaRes.arrayBuffer();

                const zuegeText = decoder.decode(zuegeBuffer);
                const abfahrtenText = decoder.decode(abfahrtenBuffer);
                const zpaText = decoder.decode(zpaBuffer);

                // Parse zuege.csv
                const zuegeLines = zuegeText.split('\n');
                const zuegeMap = {};
                for (let i = 1; i < zuegeLines.length; i++) {
                    const line = zuegeLines[i].trim();
                    if (!line) continue;
                    const cols = line.split('\t');
                    if (cols.length >= 2) {
                        zuegeMap[cols[1].trim()] = cols[0].trim();
                    }
                }

                // Parse abfahrten.csv
                const abfahrtenLines = abfahrtenText.split('\n');
                const fahrplanMap = {};
                for (let i = 1; i < abfahrtenLines.length; i++) {
                    const line = abfahrtenLines[i].trim();
                    if (!line) continue;
                    const cols = line.split('\t');
                    if (cols.length >= 5) {
                        const zugNr = cols[0].trim();
                        if (!fahrplanMap[zugNr]) fahrplanMap[zugNr] = [];
                        fahrplanMap[zugNr].push({
                            ankunft: cols[1].trim(),
                            abfahrt: cols[2].trim(),
                            haelt: cols[3].trim(),
                            bahnhof: cols[4].trim()
                        });
                    }
                }

                // Parse zpa.csv
                const zpaLines = zpaText.split('\n');
                const zpaMap = {};
                for (let i = 1; i < zpaLines.length; i++) {
                    // Do NOT trim before split - trailing tabs mark empty last columns
                    const rawLine = zpaLines[i].replace(/\r$/, '');
                    if (!rawLine.trim()) continue;
                    const cols = rawLine.split('\t');
                    if (cols.length >= 9) {
                        const zugNr = cols[0].trim();
                        if (!zpaMap[zugNr]) zpaMap[zugNr] = [];
                        zpaMap[zugNr].push({
                            gattung: cols[1].trim(),
                            vonZug: (cols[4] || '').trim(),
                            vonBf: (cols[5] || '').trim(),
                            nachBf: (cols[6] || '').trim(),
                            nachZug: (cols[7] || '').trim(),
                            umlPl: (cols[8] || '').trim(),
                            anmerkung: (cols[9] || '').trim()
                        });
                    }
                }

                window._zuegeMap = zuegeMap;
                window._fahrplanMap = fahrplanMap;
                window._zpaMap = zpaMap;

                const nachAhbZuege = [];   // Züge mit Ziel Berlin Anhalter Bf (kommen von Halle)
                const nachHalleZuege = []; // Züge ab Berlin Anhalter Bf (fahren nach Halle/Süden)

                for (const zugNr in fahrplanMap) {
                    const rows = fahrplanMap[zugNr];
                    if (rows.length === 0) continue;
                    
                    const firstRow = rows[0];
                    const lastRow = rows[rows.length - 1];
                    const gattung = zuegeMap[zugNr] || '';
                    const zugName = `${gattung} ${zugNr}`.trim();

                    window.timeToMin = (t) => {
                        if (!t) return 9999;
                        const parts = t.split('.');
                        if (parts.length === 2) {
                            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
                        }
                        return 9999;
                    };
                    const timeToMin = window.timeToMin;

                    const getZeitString = (row) => {
                        const ank = row.ankunft;
                        const abf = row.abfahrt;
                        if (ank && abf) return `${ank} - ${abf}`;
                        if (ank) return ank;
                        if (abf) return abf;
                        return "";
                    };

                    if (lastRow.bahnhof === "Berlin Anhalter Bf") {
                        nachAhbZuege.push({
                            rawZugNr: zugNr,
                            zug: zugName,
                            zeit: getZeitString(lastRow),
                            zeitMin: timeToMin(lastRow.ankunft || lastRow.abfahrt),
                            vonNach: firstRow.bahnhof,
                            gattung: gattung
                        });
                    } else if (firstRow.bahnhof === "Berlin Anhalter Bf") {
                        nachHalleZuege.push({
                            rawZugNr: zugNr,
                            zug: zugName,
                            zeit: getZeitString(firstRow),
                            zeitMin: timeToMin(firstRow.abfahrt || firstRow.ankunft),
                            vonNach: lastRow.bahnhof,
                            gattung: gattung
                        });
                    }
                }

                nachAhbZuege.sort((a, b) => a.zeitMin - b.zeitMin);
                nachHalleZuege.sort((a, b) => a.zeitMin - b.zeitMin);

                // Store globally for filter access
                window._nachAhbZuege = nachAhbZuege;
                window._nachHalleZuege = nachHalleZuege;

                window._createTable = function createTable(zuege, area) {
                    const sel = document.getElementById('station-select');
                    const station = sel ? sel.value : 'Berlin-Lichterfelde Ost';

                    let html = '<table class="fahrplan-table">';
                    html += `<thead><tr><th>Zug</th><th>Zeit</th><th>${area === 1 ? 'Nach' : 'Von'}</th></tr></thead><tbody>`;
                    zuege.forEach(z => {
                        let colorClass = '';
                        if (z.gattung === 'FD' || z.gattung === 'FDt') colorClass = 'gattung-fd';
                        else if (z.gattung === 'D') colorClass = 'gattung-d';
                        else if (z.gattung === 'E') colorClass = 'gattung-e';
                        
                        let displayTime = z.zeit;
                        let isDurchfahrt = false;
                        const rows = window._fahrplanMap ? (window._fahrplanMap[z.rawZugNr] || []) : [];
                        let curStationRow = rows.find(r => r.bahnhof === station);
                        if (!curStationRow) curStationRow = rows.find(r => r.bahnhof === 'Berlin Anhalter Bf');
                        if (curStationRow) {
                            const timeStrForCalc = (station === 'Berlin Anhalter Bf' && area === 1) ? (curStationRow.abfahrt || curStationRow.ankunft) : (curStationRow.ankunft || curStationRow.abfahrt);
                            if (timeStrForCalc) displayTime = timeStrForCalc;
                            isDurchfahrt = (curStationRow.haelt === 'D');
                        }
                        
                        const finalTimeHtml = isDurchfahrt ? `<i>(${displayTime})</i>` : displayTime;
                        
                        html += `<tr class="${colorClass}" data-zugnr="${z.rawZugNr}" onclick="window.selectTrain('${z.rawZugNr}', ${area}, this)">
                            <td>${z.zug}</td>
                            <td>${finalTimeHtml}</td>
                            <td style="text-align:${area === 1 ? 'left' : 'right'};">${z.vonNach}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                    return html;
                };

                // col1 = nach Halle (left column), col5 = nach Ahb (right column)
                document.querySelector('#col1 .col-content').innerHTML = window._createTable(nachHalleZuege, 1);
                document.querySelector('#col5 .col-content').innerHTML = window._createTable(nachAhbZuege, 5);

                window.selectTrain = function(zugNr, area, trElement) {
                    const tbody = trElement.closest('tbody');
                    tbody.querySelectorAll('tr').forEach(tr => tr.classList.remove('selected'));
                    trElement.classList.add('selected');

                    const rows = window._fahrplanMap[zugNr];
                    if (!rows) return;
                    const targetArea = area === 1 ? 2 : 4;
                    if (!window._laufwegStates) window._laufwegStates = {};
                    window._laufwegStates[targetArea] = rows;

                    const gattung = window._zuegeMap[zugNr] || '';
                    const zugName = `${gattung} ${zugNr}`.trim();
                    const firstRow = rows[0];
                    const lastRow = rows[rows.length - 1];

                    if (area === 1) {
                        // nach Halle: Zug fährt von Ahb weg
                        document.getElementById('info-col2').textContent = `${zugName} nach ${lastRow.bahnhof}`;
                    } else if (area === 5) {
                        // nach Ahb: Zug kommt von Halle
                        document.getElementById('info-col4').textContent = `${zugName} von ${firstRow.bahnhof}`;
                    }

                    const tState = tabState[targetArea];

                    // Laufweg HTML
                    let lwHtml = `<div class="content-laufweg" style="display:${tState === 'laufweg' ? 'block' : 'none'}">`;
                    lwHtml += '<table class="fahrplan-table">';
                    lwHtml += '<thead><tr><th>Ankunft</th><th>Abfahrt</th><th>Bahnhof</th></tr></thead><tbody>';
                    const sel = document.getElementById('station-select');
                    const currentStation = sel ? sel.value : 'Berlin-Lichterfelde Ost';
                    
                    // Current time in minutes
                    const nowMin = clockH * 60 + clockM + clockS / 60;
                    
                    const tToMin = (t) => {
                        if (!t) return null;
                        const p = t.trim().split('.');
                        return p.length === 2 ? parseInt(p[0]) * 60 + parseInt(p[1]) : null;
                    };
                    
                    // Determine posRow and pulsing state: handled live by _updateLaufwegDot()
                    
                    for (let i = 0; i < rows.length; i++) {
                        const r = rows[i];
                        let rowStyle = "";
                        if (r.haelt === 'D') rowStyle += "font-style: italic;";
                        if (r.bahnhof === currentStation) rowStyle += " background-color: #ffeba1;";
                        
                        const styleAttr = rowStyle ? ` style="${rowStyle.trim()}"` : "";
                        
                        if (r.haelt === 'D') {
                            const time = r.abfahrt || r.ankunft;
                            lwHtml += `<tr${styleAttr}><td colspan="2" style="text-align: center; font-style: italic; color: #555;">(<i>${time}</i>)</td><td>${r.bahnhof}</td></tr>`;
                        } else if (r.ankunft && r.abfahrt) {
                            lwHtml += `<tr${styleAttr}><td>${r.ankunft}</td><td>${r.abfahrt}</td><td>${r.bahnhof}</td></tr>`;
                        } else {
                            const singleTime = r.ankunft || r.abfahrt || '';
                            lwHtml += `<tr${styleAttr}><td colspan="2" style="text-align: center;">${singleTime}</td><td>${r.bahnhof}</td></tr>`;
                        }
                    }
                    lwHtml += '</tbody></table></div>';

                    // Zp HTML
                    const zpRows = window._zpaMap[zugNr] || [];
                    let zpHtml = `<div class="content-zp" style="display:${tState === 'zp' ? 'block' : 'none'}; height:100%;">`;
                    if (zpRows.length === 0) {
                        zpHtml += '<div style="display:flex; justify-content:center; align-items:center; height:100%; font-style:italic; color:#888;">kein Zp vorhanden</div>';
                    } else {
                        zpHtml += '<table class="fahrplan-table" style="font-size:11px;">';
                        zpHtml += '<thead><tr><th>#</th><th>Gattung</th><th>von Zug</th><th>von Bf</th><th>nach Zug</th><th>nach Bf</th><th>Uml.Pl</th><th>Anmerkung</th></tr></thead><tbody>';
                        zpRows.forEach((r, i) => {
                            zpHtml += `<tr><td>${i+1}</td><td>${r.gattung}</td><td>${r.vonZug}</td><td>${r.vonBf}</td><td>${r.nachZug}</td><td>${r.nachBf}</td><td>${r.umlPl}</td><td>${r.anmerkung}</td></tr>`;
                        });
                        zpHtml += '</tbody></table>';
                    }
                    zpHtml += '</div>';

                    const finalHtml = lwHtml + zpHtml;

                    if (area === 1) {
                        document.querySelector('#col2 .col-content').innerHTML = finalHtml;
                    } else if (area === 5) {
                        document.querySelector('#col4 .col-content').innerHTML = finalHtml;
                    }
                };

            } catch (err) {
                console.error("Fehler beim Laden des Fahrplans:", err);
                const errorMsg = `<div style="color:red;padding:10px;">Fehler: ${err.message}</div>`;
                document.querySelector('#col1 .col-content').innerHTML = errorMsg;
                document.querySelector('#col5 .col-content').innerHTML = errorMsg;
            }
        }
        
        window._currentNextTrain = { 1: null, 5: null };

        loadFahrplan().then(() => {
            if (typeof window.autoSelectNextTrain === 'function') {
                window.autoSelectNextTrain();
            }
        });

        window.autoSelectNextTrain = function() {
            const sel = document.getElementById('station-select');
            const station = sel ? sel.value : 'Berlin-Lichterfelde Ost';
            const currentTimeSec = (clockH * 60 + clockM) * 60 + clockS;

            // Get the time (in minutes) for a train at the selected station
            const getTimeAtStation = (z, area) => {
                const rows = window._fahrplanMap ? (window._fahrplanMap[z.rawZugNr] || []) : [];
                let r = rows.find(r => r.bahnhof === station);
                if (!r) r = rows.find(r => r.bahnhof === 'Berlin Anhalter Bf');
                if (!r) return z.zeitMin;
                const timeStr = (station === 'Berlin Anhalter Bf' && area === 1)
                    ? (r.abfahrt || r.ankunft)
                    : (r.ankunft || r.abfahrt);
                return window.timeToMin(timeStr);
            };
            
            const findNext = (zuege, area) => {
                // Find train with smallest positive time diff, allowing up to 3 min in past
                let nextZug = null;
                let minDiff = Infinity;
                for (const z of zuege) {
                    const tMin = getTimeAtStation(z, area);
                    let diff = tMin * 60 - currentTimeSec;
                    if (diff < -12 * 3600) diff += 24 * 3600;
                    if (diff > 12 * 3600) diff -= 24 * 3600;
                    if (diff >= -180 && diff < minDiff) {
                        minDiff = diff;
                        nextZug = z;
                    }
                }
                if (!nextZug && zuege.length > 0) nextZug = zuege[0];
                
                if (nextZug) {
                    const colId = area === 1 ? 'col1' : 'col5';
                    const tr = document.querySelector(`#${colId} tr[data-zugnr="${nextZug.rawZugNr}"]`);
                    
                    if (tr) {
                        document.querySelectorAll(`#${colId} tr.next-train`).forEach(el => el.classList.remove('next-train'));
                        tr.classList.add('next-train');
                        
                        if (window._currentNextTrain[area] !== nextZug.rawZugNr) {
                            window._currentNextTrain[area] = nextZug.rawZugNr;
                            
                            // Select it in area 2/4
                            selectTrain(nextZug.rawZugNr, area, tr);
                            
                            // Scroll it to top (approx 30px offset for the sticky header)
                            const container = document.querySelector(`#${colId} .col-content`);
                            container.scrollTo({
                                top: Math.max(0, tr.offsetTop - 30),
                                behavior: 'smooth'
                            });
                        }
                    }
                }
            };

            if (window._nachAhbZuege) findNext(window._nachAhbZuege, 5);
            if (window._nachHalleZuege) findNext(window._nachHalleZuege, 1);
        };
        
        document.getElementById('station-select').addEventListener('change', () => {
            const sel1 = document.querySelector('#col1 tr.selected');
            const z1 = sel1 ? sel1.getAttribute('data-zugnr') : null;
            const sel5 = document.querySelector('#col5 tr.selected');
            const z5 = sel5 ? sel5.getAttribute('data-zugnr') : null;

            if (typeof window.applyFilters === 'function') window.applyFilters();
            if (typeof window.autoSelectNextTrain === 'function') window.autoSelectNextTrain();

            if (z1) {
                const tr1 = document.querySelector(`#col1 tr[data-zugnr="${z1}"]`);
                if (tr1) tr1.classList.add('selected');
            }
            if (z5) {
                const tr5 = document.querySelector(`#col5 tr[data-zugnr="${z5}"]`);
                if (tr5) tr5.classList.add('selected');
            }
        });

        // --- Signal Train Info ---
        // --- Train Animation & Signal Logic ---
        window.updateSignalTrainInfo = function() {
            // UI info update is now handled in the animation loop to ensure smooth countdowns
        };

        class TrainAnimator {
            constructor(isTopTrack, trainId, signalId, routeId, countdownId, area) {
                this.isTopTrack = isTopTrack;
                this.trainEl = document.getElementById(trainId);
                this.signalEl = document.getElementById(signalId);
                this.routeEl = document.getElementById(routeId);
                this.countdownEl = document.getElementById(countdownId);
                this.area = area;
                
                this.frontX = isTopTrack ? window.innerWidth + 100 : -100;
                this.speed = 0;
                this.maxSpeed = 2; // px per frame
                this.acceleration = 0.02;
                this.currentZugNr = null;
                this.sigState = 'fahrt';
                this.width = 100;
                // Shunting elements (only used at Berlin Anhalter Bf)
                this.rangierlokEl = document.getElementById(isTopTrack ? 'rangierlok-top' : 'rangierlok-bottom');
                this.zugLokEl    = document.getElementById(isTopTrack ? 'zuglok-top'    : 'zuglok-bottom');
                // Shunting state machine
                this.shuntPhase  = 'IDLE'; // IDLE | DEPART_IN | DEPART_SHUNTER_OUT | DEPART_LOK_PAUSE | DEPART_LOK_IN | DEPART_READY | DEPARTING
                                           //      | ARRIVE_SHUNTER_IN | ARRIVE_PULLING | ARRIVE_LOK_FOLLOWS | ARRIVE_DONE
                this.shuntTimer  = 0;  // real ms timer for current phase
                this.rlX         = 0;  // rangierlok left-edge position
                this.rlWidth     = 0;  // rangierlok width (px)
                this.zlX         = 0;  // zuglok left-edge position
                this.zlWidth     = 0;  // zuglok width
                this.shuntTrainX = 0;  // train left-edge when shunting controls positioning
            }

            gatClass(g) {
                if (g === 'FD' || g === 'FDt') return 'sig-gat-fd';
                if (g === 'D') return 'sig-gat-d';
                if (g === 'E') return 'sig-gat-e';
                return 'sig-gat-p';
            }

            // ── Shunting helpers ─────────────────────────────────────────────────
            _hideShuntElements() {
                if (this.rangierlokEl) this.rangierlokEl.style.display = 'none';
                if (this.zugLokEl)    this.zugLokEl.style.display = 'none';
            }

            _imgEl(src, mirror = false) {
                const div = document.createElement('div');
                div.className = 'vehicle';
                const img = document.createElement('img');
                img.src = src;
                if (mirror) img.style.transform = 'scaleX(-1)';
                div.appendChild(img);
                return div;
            }

            _buildRangierlok(el, mirror = false) {
                el.innerHTML = '';
                el.style.gap = '0'; el.style.bottom = '5px'; el.style.flexDirection = 'row';
                el.appendChild(this._imgEl('./data/img/loks/rangierlok.gif', mirror));
                el.style.display = 'flex';
                el.getBoundingClientRect(); // force layout
                this.rlWidth = el.getBoundingClientRect().width || 50;
            }

            _buildZugLok(el, mirror = false) {
                el.innerHTML = '';
                el.style.gap = '0'; el.style.bottom = '5px'; el.style.flexDirection = 'row';
                el.appendChild(this._imgEl('./data/img/pwagen/lok.png', mirror));
                el.style.display = 'flex';
                el.getBoundingClientRect();
                this.zlWidth = el.getBoundingClientRect().width || 60;
            }

            _buildCarsOnly(el, zugNr, reverse = false) {
                const zpList = (window._zpaMap && window._zpaMap[zugNr]) || [];
                el.innerHTML = '';
                el.style.gap = '5px'; el.style.bottom = '5px';
                el.style.flexDirection = reverse ? 'row-reverse' : 'row';
                zpList.forEach(w => {
                    let base = w.gattung.split(' ')[0].split(/ue|ü|\?|-|(?<=[0-9])[a-z]/i)[0] || 'Unbekannt';
                    const img = document.createElement('img');
                    img.src = `./data/img/pwagen/${base}.png`;
                    img.onerror = function() { this.onerror = null; this.src = './data/img/pwagen/Unbekannt.png'; };
                    const div = document.createElement('div'); div.className = 'vehicle'; div.appendChild(img);
                    el.appendChild(div);
                });
                el.style.display = 'flex';
                el.getBoundingClientRect();
            }

            // ── Shunting state machine ────────────────────────────────────────────
            // Called every frame when station === 'Berlin Anhalter Bf'.
            // Returns true if shunting is controlling the train position (TrainAnimator should skip its own positioning).
            shuntUpdate(dt, diffSec, z, signalX, screenW) {
                const ts = Math.min(dt / 16.66, 5); // time-scale
                const accel = 0.03;
                const maxSpd = 2.5;

                const moveToward = (cur, target) => {
                    const dist = target - cur;
                    if (Math.abs(dist) < 0.5) return target;
                    const brakeSp = Math.sqrt(2 * accel * Math.abs(dist));
                    const sp = Math.min((this._shuntSpeed || 0) + accel * ts, maxSpd, brakeSp);
                    this._shuntSpeed = sp;
                    return cur + Math.sign(dist) * sp * ts;
                };
                const moveLeft = (cur) => {
                    const sp = Math.min((this._shuntSpeed || 0) + accel * ts, maxSpd);
                    this._shuntSpeed = sp;
                    return cur - sp * ts;
                };
                const moveRight = (cur) => {
                    const sp = Math.min((this._shuntSpeed || 0) + accel * ts, maxSpd);
                    this._shuntSpeed = sp;
                    return cur + sp * ts;
                };

                // ── DEPARTING train (top track) ─────────────────────────────────
                if (this.isTopTrack) {
                    switch (this.shuntPhase) {
                        case 'IDLE':
                            if (diffSec <= 180) {
                                // Build: [Rangierlok][Cars], enter from left
                                this._buildCarsOnly(this.trainEl, z.rawZugNr, false);
                                this.width = this.trainEl.getBoundingClientRect().width || 200;
                                this._buildRangierlok(this.rangierlokEl, true); // mirrored: facing right to push
                                // Start positions: off-screen left
                                this.shuntTrainX = -this.width - this.rlWidth - 80;
                                this.rlX          = -this.rlWidth - 80;
                                this.trainEl.style.left = `${this.shuntTrainX}px`;
                                this.rangierlokEl.style.left = `${this.rlX}px`;
                                this._shuntSpeed = 0;
                                this.shuntPhase = 'DEPART_IN';
                                this.frontX = signalX; // keep TrainAnimator's tracking in sync
                            }
                            return false;

                        case 'DEPART_IN': {
                            // Move right: cars stop at trainTargetX = signalX, rl just behind
                            const carTarget = signalX;
                            const atTarget  = Math.abs(this.shuntTrainX - carTarget) < 0.5;
                            if (!atTarget) {
                                const next = moveToward(this.shuntTrainX, carTarget);
                                const delta = next - this.shuntTrainX;
                                this.shuntTrainX = next;
                                this.rlX += delta;
                            } else {
                                this.shuntTrainX = carTarget;
                                this.rlX = carTarget - this.rlWidth - 2;
                                this._shuntSpeed = 0;
                                this.shuntTimer = 0;
                                this.shuntPhase = 'DEPART_SHUNTER_OUT';
                            }
                            this.trainEl.style.left = `${this.shuntTrainX}px`;
                            this.rangierlokEl.style.left = `${this.rlX}px`;
                            return true;
                        }

                        case 'DEPART_SHUNTER_OUT':
                            this.shuntTimer += dt;
                            if (this.shuntTimer < 1200) return true; // 1.2s pause
                            this._shuntSpeed = 0;
                            this.shuntPhase = 'DEPART_RL_OUT';
                            // fall through
                        case 'DEPART_RL_OUT':
                            this.rlX = moveLeft(this.rlX);
                            this.rangierlokEl.style.left = `${this.rlX}px`;
                            if (this.rlX + this.rlWidth < -20) {
                                this.rangierlokEl.style.display = 'none';
                                this._shuntSpeed = 0;
                                this.shuntTimer = 0;
                                this.shuntPhase = 'DEPART_LOK_PAUSE';
                            }
                            return true;

                        case 'DEPART_LOK_PAUSE':
                            this.shuntTimer += dt;
                            if (this.shuntTimer >= 10000) { // 10 real seconds
                                this._buildZugLok(this.zugLokEl, false); // lok facing left to depart
                                this.zlX = -this.zlWidth - 50; // start off-screen left
                                this.zugLokEl.style.left = `${this.zlX}px`;
                                this._shuntSpeed = 0;
                                this.shuntPhase = 'DEPART_LOK_IN';
                            }
                            return true;

                        case 'DEPART_LOK_IN': {
                            // Zuglok moves right to attach at left of cars (target: shuntTrainX - zlWidth - 2)
                            const lokTarget = this.shuntTrainX - this.zlWidth - 2;
                            const at = Math.abs(this.zlX - lokTarget) < 0.5;
                            if (!at) {
                                this.zlX = moveToward(this.zlX, lokTarget);
                            } else {
                                this.zlX = lokTarget;
                                this._shuntSpeed = 0;
                                this.shuntPhase = 'DEPART_READY';
                            }
                            this.zugLokEl.style.left = `${this.zlX}px`;
                            return true;
                        }

                        case 'DEPART_READY':
                            if (diffSec <= 0) {
                                this._shuntSpeed = 0;
                                this.shuntPhase = 'DEPARTING';
                            }
                            return true; // keep blocking

                        case 'DEPARTING': {
                            // Both Zuglok and cars move left together
                            const sp = Math.min((this._shuntSpeed || 0) + accel * ts, maxSpd);
                            this._shuntSpeed = sp;
                            this.zlX -= sp * ts;
                            this.shuntTrainX -= sp * ts;
                            this.zugLokEl.style.left = `${this.zlX}px`;
                            this.trainEl.style.left  = `${this.shuntTrainX}px`;
                            if (this.shuntTrainX + this.width < -100) {
                                this.trainEl.style.display = 'none';
                                this.zugLokEl.style.display = 'none';
                                this._hideShuntElements();
                                this.shuntPhase = 'IDLE';
                                this.currentZugNr = null;
                            }
                            return true;
                        }
                    }
                }

                // ── ARRIVING train (bottom track) ───────────────────────────────
                if (!this.isTopTrack) {
                    switch (this.shuntPhase) {
                        case 'IDLE':
                            // Activate 3 sim-minutes (180 sim-sec) after arrival (diffSec < -180)
                            if (diffSec < -180) {
                                // Split train: cars in trainEl, Lok separate in zugLokEl
                                this._buildCarsOnly(this.trainEl, z.rawZugNr, true); // row-reverse (cars on left, empty right where Lok was)
                                this.width = this.trainEl.getBoundingClientRect().width || 200;
                                // trainEl left edge: signalX - totalWidth; since we removed Lok width, approximate
                                this.shuntTrainX = signalX - this.width; // left edge of cars portion
                                this.trainEl.style.left = `${this.shuntTrainX}px`;

                                // Zuglok at the right end (where it would have been)
                                this._buildZugLok(this.zugLokEl, true); // mirrored: facing right (arrived from right)
                                this.zlX = signalX - this.zlWidth;
                                this.zugLokEl.style.left = `${this.zlX}px`;

                                // Rangierlok comes from left, mirrored to face right
                                this._buildRangierlok(this.rangierlokEl, false);
                                this.rlX = -this.rlWidth - 50;
                                this.rangierlokEl.style.left = `${this.rlX}px`;
                                this._shuntSpeed = 0;
                                this.shuntPhase = 'ARRIVE_RL_IN';
                            }
                            return false;

                        case 'ARRIVE_RL_IN': {
                            // Rangierlok moves right to attach at left of cars
                            const target = this.shuntTrainX - this.rlWidth - 2;
                            const at = Math.abs(this.rlX - target) < 0.5;
                            if (!at) {
                                this.rlX = moveToward(this.rlX, target);
                            } else {
                                this.rlX = target;
                                this._shuntSpeed = 0;
                                this.shuntTimer = 0;
                                this.shuntPhase = 'ARRIVE_PAUSE';
                            }
                            this.rangierlokEl.style.left = `${this.rlX}px`;
                            return true;
                        }

                        case 'ARRIVE_PAUSE':
                            this.shuntTimer += dt;
                            if (this.shuntTimer >= 800) {
                                this._shuntSpeed = 0;
                                this.shuntPhase = 'ARRIVE_PULLING';
                            }
                            return true;

                        case 'ARRIVE_PULLING': {
                            // Rangierlok + cars move left together; Zuglok stays
                            const sp = Math.min((this._shuntSpeed || 0) + accel * ts, maxSpd);
                            this._shuntSpeed = sp;
                            this.rlX -= sp * ts;
                            this.shuntTrainX -= sp * ts;
                            this.rangierlokEl.style.left = `${this.rlX}px`;
                            this.trainEl.style.left      = `${this.shuntTrainX}px`;
                            // When train is halfway off-screen left, start Zuglok
                            if (this.shuntTrainX + this.width / 2 < 0) {
                                this.shuntPhase = 'ARRIVE_LOK_FOLLOWS';
                            }
                            return true;
                        }

                        case 'ARRIVE_LOK_FOLLOWS': {
                            const sp = Math.min((this._shuntSpeed || 0) + accel * ts, maxSpd);
                            this._shuntSpeed = sp;
                            this.rlX -= sp * ts;
                            this.shuntTrainX -= sp * ts;
                            this.zlX -= sp * ts;
                            this.rangierlokEl.style.left = `${this.rlX}px`;
                            this.trainEl.style.left      = `${this.shuntTrainX}px`;
                            this.zugLokEl.style.left     = `${this.zlX}px`;
                            if (this.shuntTrainX + this.width < -100 && this.zlX + this.zlWidth < -100) {
                                this.trainEl.style.display = 'none';
                                this._hideShuntElements();
                                this.shuntPhase = 'IDLE';
                                this.currentZugNr = null;
                            }
                            return true;
                        }
                    }
                }

                return false;
            }

            update(dt, currentTimeSec) {
                const zuegeList = this.area === 5 ? window._nachAhbZuege : window._nachHalleZuege;
                if (!zuegeList || zuegeList.length === 0) return;
                
                const sel = document.getElementById('station-select');
                const station = sel ? sel.value : 'Berlin-Lichterfelde Ost';
                
                // Helper to get time at selected station for a train
                const getTrainTimeAtStation = (zug) => {
                    const rows = window._fahrplanMap ? (window._fahrplanMap[zug.rawZugNr] || []) : [];
                    let r = rows.find(r => r.bahnhof === station);
                    if (!r) r = rows.find(r => r.bahnhof === 'Berlin Anhalter Bf');
                    if (!r) return zug.zeitMin;
                    const timeStr = (station === 'Berlin Anhalter Bf' && this.area === 1) ? (r.abfahrt || r.ankunft) : (r.ankunft || r.abfahrt);
                    return window.timeToMin(timeStr);
                };
                
                let bestTrain = null;
                let minDiff = Infinity;
                for (const t of zuegeList) {
                    const tMin = getTrainTimeAtStation(t);
                    let diff = tMin * 60 - currentTimeSec;
                    if (diff < -12 * 3600) diff += 24 * 3600;
                    if (diff > 12 * 3600) diff -= 24 * 3600;
                    if (diff >= -180 && diff < minDiff) {
                        minDiff = diff;
                        bestTrain = t;
                    }
                }
                let z = bestTrain || zuegeList[0];
                
                if (!z) {
                    this.trainEl.style.display = 'none';
                    this.routeEl.innerHTML = '';
                    this.countdownEl.textContent = '';
                    return;
                }

                const rows = window._fahrplanMap ? (window._fahrplanMap[z.rawZugNr] || []) : [];
                let curStationRow = rows.find(r => r.bahnhof === station);
                if (!curStationRow) curStationRow = rows.find(r => r.bahnhof === 'Berlin Anhalter Bf');
                
                let tMin = z.zeitMin;
                let isDurchfahrt = false;
                let displayTime = z.zeit;
                
                if (curStationRow) {
                    const timeStrForCalc = (station === 'Berlin Anhalter Bf' && this.area === 1) ? (curStationRow.abfahrt || curStationRow.ankunft) : (curStationRow.ankunft || curStationRow.abfahrt);
                    tMin = window.timeToMin(timeStrForCalc);
                    isDurchfahrt = (curStationRow.haelt === 'D');
                    displayTime = timeStrForCalc;
                }
                
                const T_sec = tMin * 60;
                let diffSec = T_sec - currentTimeSec; // positive means in future
                if (diffSec > 12 * 3600) diffSec -= 24 * 3600;
                if (diffSec < -12 * 3600) diffSec += 24 * 3600;

                // Update Route & Countdown UI
                const g = z.gattung || '';
                const cls = this.gatClass(g);
                
                // Find next stop from Laufweg
                // (sel, station, rows already declared above)
                let stopLabel = '';
                if (rows.length > 0) {
                    const ahbName = 'Berlin Anhalter Bf';
                    const liName = 'Berlin-Lichterfelde Ost';
                    const curStation = (station === 'Berlin Anhalter Bf') ? ahbName : liName;
                    let curIdx = rows.findIndex(r => r.bahnhof === curStation);
                    if (curIdx < 0) {
                        curIdx = rows.findIndex(r => r.bahnhof === ahbName);
                    }
                    
                    if (this.area === 1) {
                        // area 1: away from Ahb (nach Halle)
                        if (curIdx >= 0 && curIdx + 1 < rows.length) {
                            stopLabel = ` (nächster Halt: ${rows[curIdx + 1].bahnhof})`;
                        }
                    } else {
                        // area 5: towards Ahb (aus Halle)
                        if (curIdx > 0) {
                            stopLabel = ` (letzter Halt: ${rows[curIdx - 1].bahnhof})`;
                        }
                    }
                }
                
                let vonNachPrefix = this.area === 5 ? 'aus ' : '';
                const timeDisplay = isDurchfahrt ? `<i>(${displayTime})</i>` : displayTime;
                this.routeEl.innerHTML = `${timeDisplay}&nbsp;<span class="${cls}"><strong>${z.zug}</strong></span>&nbsp;${vonNachPrefix}${z.vonNach}${stopLabel ? `<span style="color:#aaa;font-size:0.9em">${stopLabel}</span>` : ''}`;
                
                const screenW = window.innerWidth;
                const signalX = this.isTopTrack ? 80 : screenW - 80;
                const travelDist = screenW + 20;
                const realTravelTime = travelDist / 120; // 120px per sec
                const simTravelTime = realTravelTime * timeMul;
                
                let stopping = false;
                if (rows.length > 0) {
                    const ahbName = 'Berlin Anhalter Bf';
                    const liName = 'Berlin-Lichterfelde Ost';
                    const curStation = (station === 'Berlin Anhalter Bf') ? ahbName : liName;
                    let localCurIdx = rows.findIndex(r => r.bahnhof === curStation);
                    if (localCurIdx < 0) localCurIdx = rows.findIndex(r => r.bahnhof === ahbName);
                    
                    if (localCurIdx >= 0) {
                        stopping = (rows[localCurIdx].haelt !== 'D');
                    } else {
                        stopping = (g === 'P');
                    }
                } else {
                    stopping = (g === 'P');
                }
                
                const waitSimTime = stopping ? 60 : 0; // stop for 60 simulated seconds
                const spawnDiffSec = simTravelTime + waitSimTime;
                
                let isKopfbahnhofDepart = (station === 'Berlin Anhalter Bf' && this.isTopTrack);
                let isKopfbahnhofArrive = (station === 'Berlin Anhalter Bf' && !this.isTopTrack);
                let shouldBeActive = false;
                if (isKopfbahnhofDepart) {
                    shouldBeActive = (diffSec <= 180 && diffSec >= -120);
                } else if (isKopfbahnhofArrive) {
                    shouldBeActive = (diffSec <= spawnDiffSec && diffSec >= -180);
                } else {
                    shouldBeActive = (diffSec <= spawnDiffSec && diffSec >= -120);
                }

                // Countdown Logic (Real time until train front reaches the signal)
                let realTimeToSignal = 0;
                let showCountdown = false;

                if (this.currentZugNr) {
                    let distToSignal = this.isTopTrack ? (this.frontX - signalX) : (signalX - this.frontX);
                    if (distToSignal > 2) {
                        realTimeToSignal = distToSignal / 120;
                        showCountdown = true;
                    } else if (isKopfbahnhofDepart && diffSec > 0) {
                        realTimeToSignal = diffSec / timeMul;
                        showCountdown = true;
                    }
                } else if (diffSec > 0 && diffSec < 12 * 3600) {
                    if (isKopfbahnhofDepart) {
                        realTimeToSignal = diffSec / timeMul;
                        showCountdown = true;
                    } else {
                        let simTimeUntilSpawn = diffSec - spawnDiffSec;
                        if (simTimeUntilSpawn > 0) {
                            realTimeToSignal = (simTimeUntilSpawn / timeMul) + realTravelTime;
                            showCountdown = true;
                        } else {
                            realTimeToSignal = realTravelTime;
                            showCountdown = true;
                        }
                    }
                }

                if (showCountdown) {
                    const m = Math.floor(realTimeToSignal / 60);
                    const s = Math.floor(realTimeToSignal % 60);
                    this.countdownEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
                    this.countdownEl.style.display = 'block';
                } else {
                    this.countdownEl.style.display = 'none';
                }

                if (z.rawZugNr !== this.currentZugNr) {
                    if (shouldBeActive) {
                        // Reset shunting when new train comes
                        if (this.shuntPhase !== 'IDLE') this._hideShuntElements();
                        this.shuntPhase = 'IDLE';
                        this._shuntSpeed = 0;
                        this.currentZugNr = z.rawZugNr;
                        
                        if (isKopfbahnhofDepart) {
                            // shuntUpdate() will handle everything
                            this.frontX = signalX;
                            this.trainEl.style.opacity = '1';
                            this.trainEl.style.transition = '';
                            // Don't render train here – shuntUpdate DEPART_IN will build it
                        } else if (isKopfbahnhofArrive) {
                            // Normal arrival: spawn from far side, shuntUpdate handles post-arrival
                            this.frontX = this.isTopTrack ? screenW + 100 : -100;
                            this.trainEl.style.opacity = '1';
                            this.trainEl.style.transition = '';
                            const viewMode = document.querySelector('input[name="view-mode"]:checked')?.value;
                            if (viewMode === 'schematic') renderSchematicTrain(this.trainEl, z, this.isTopTrack);
                            else this.trainEl.innerHTML = '';
                        } else {
                            this.frontX = this.isTopTrack ? screenW + 100 : -100;
                            this.trainEl.style.opacity = '1';
                            this.trainEl.style.transition = '';
                            const viewMode = document.querySelector('input[name="view-mode"]:checked')?.value;
                            if (viewMode === 'schematic') renderSchematicTrain(this.trainEl, z, this.isTopTrack);
                            else this.trainEl.innerHTML = '';
                        }
                        this.speed = (isKopfbahnhofDepart) ? 0 : this.maxSpeed;
                    } else {
                        this.trainEl.style.display = 'none';
                        if (diffSec < 0) this.routeEl.innerHTML = '';
                        return;
                    }
                }
                
                this.width = this.trainEl.getBoundingClientRect().width || 100;
                
                // ── Shunting takes full control at Berlin Anhalter Bf ──────────
                if (station === 'Berlin Anhalter Bf' && (isKopfbahnhofDepart || isKopfbahnhofArrive)) {
                    const shuntHandled = this.shuntUpdate(dt, diffSec, z, signalX, screenW);
                    if (shuntHandled) {
                        // shuntUpdate sets trainEl.style.left directly; just ensure it's visible
                        this.trainEl.style.display = 'flex';
                        this.signalEl.style.display = isKopfbahnhofArrive ? 'none' : 'block';
                        // Signal: Halt until shunt DEPARTING or DONE
                        const shuntDeparting = this.shuntPhase === 'DEPARTING' || this.shuntPhase === 'ARRIVE_LOK_FOLLOWS';
                        this.sigState = (isKopfbahnhofDepart && shuntDeparting) ? 'fahrt' : 'halt';
                        this.signalEl.className = `signal ${this.sigState}`;
                        return;
                    }
                }

                let backX = this.isTopTrack ? this.frontX + this.width : this.frontX - this.width;
                let isOffScreen = this.isTopTrack ? (backX < -100) : (backX > screenW + 100);
                
                if (!shouldBeActive && isOffScreen) {
                    this.trainEl.style.display = 'none';
                    this.currentZugNr = null;
                    if (diffSec < 0) this.routeEl.innerHTML = '';
                    return;
                }
                
                this.trainEl.style.display = 'flex';

                if (station === 'Berlin Anhalter Bf' && !this.isTopTrack) {
                    this.signalEl.style.display = 'none';
                } else {
                    this.signalEl.style.display = 'block';
                }

                if (isKopfbahnhofArrive || (stopping && diffSec > 0)) {
                    this.sigState = 'halt';
                } else {
                    this.sigState = 'fahrt';
                }
                this.signalEl.className = `signal ${this.sigState}`;
                
                let timeScale = dt / 16.66;
                if (timeScale > 5) timeScale = 5; 
                
                let targetX = signalX;

                if (this.isTopTrack) { 
                    if (this.sigState === 'halt' && this.frontX >= targetX) {
                        if (this.frontX > targetX) {
                            let dist = this.frontX - targetX;
                            let targetSpeed = Math.sqrt(2 * this.acceleration * dist);
                            this.speed = Math.min(this.speed, targetSpeed);
                        } else {
                            this.speed = 0;
                        }
                        if (this.frontX - targetX <= 1 && this.speed < 0.5) {
                            this.speed = 0;
                            this.frontX = targetX;
                        }
                    } else {
                        if (this.speed < this.maxSpeed) this.speed += this.acceleration * timeScale;
                        if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
                    }
                    this.frontX -= this.speed * timeScale;
                } else { 
                    if (this.sigState === 'halt' && this.frontX <= targetX) {
                        if (this.frontX < targetX) {
                            let dist = targetX - this.frontX;
                            let targetSpeed = Math.sqrt(2 * this.acceleration * dist);
                            this.speed = Math.min(this.speed, targetSpeed);
                        } else {
                            this.speed = 0;
                        }
                        if (targetX - this.frontX <= 1 && this.speed < 0.5) {
                            this.speed = 0;
                            this.frontX = targetX;
                        }
                    } else {
                        if (this.speed < this.maxSpeed) this.speed += this.acceleration * timeScale;
                        if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
                    }
                    this.frontX += this.speed * timeScale;
                }

                let leftPos = this.isTopTrack ? this.frontX : (this.frontX - this.width);
                this.trainEl.style.left = `${leftPos}px`;
            }
        }

        const animTop = new TrainAnimator(true, 'train-top', 'signal-top', 'route-top', 'countdown-top', 1);
        const animBottom = new TrainAnimator(false, 'train-bottom', 'signal-bottom', 'route-bottom', 'countdown-bottom', 5);

        // Live update of the Laufweg position dot when clock changes
        window._laufwegStates = {};
        window._updateLaufwegDot = function() {
            if (!window._laufwegStates) return;
            const nowMin = clockH * 60 + clockM + clockS / 60;
            const tToMin = (t) => {
                if (!t) return null;
                const p = t.trim().split('.');
                return p.length === 2 ? parseInt(p[0]) * 60 + parseInt(p[1]) : null;
            };
            for (const [areaKey, rows] of Object.entries(window._laufwegStates)) {
                if (!rows) continue;
                const laufwegTable = document.querySelector(`#col${areaKey} .content-laufweg table tbody`);
                if (!laufwegTable) continue;
                let posRow = -1;
                let dotPulsing = false;
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i];
                    const ank = tToMin(r.ankunft);
                    const abf = tToMin(r.abfahrt);
                    const arrMin = ank !== null ? ank : abf;
                    const depMin = abf !== null ? abf : ank;
                    if (arrMin === null) continue;
                    if (nowMin < arrMin) break; // not yet reached – dot stays at last departed
                    if (nowMin >= arrMin && (depMin === null || nowMin < depMin + 1)) { posRow = i; dotPulsing = true; break; }
                    // departed → tentatively here (static), continue to next
                    posRow = i; dotPulsing = false;
                }
                // Remove existing dots and place new one
                laufwegTable.querySelectorAll('.zug-pos-dot').forEach(el => el.remove());
                if (posRow >= 0) {
                    const trs = laufwegTable.querySelectorAll('tr');
                    if (trs[posRow]) {
                        const bahnhofTd = trs[posRow].lastElementChild;
                        if (bahnhofTd) {
                            const dot = document.createElement('span');
                            dot.className = dotPulsing ? 'zug-pos-dot pulsing' : 'zug-pos-dot';
                            dot.style.marginRight = '4px';
                            dot.style.verticalAlign = 'middle';
                            bahnhofTd.prepend(dot);
                        }
                    }
                }
            }
        };

        let lastAnimTime = performance.now();
        function animationLoop(now) {
            let dt = now - lastAnimTime;
            lastAnimTime = now;
            
            const currentTimeMin = clockH * 60 + clockM;
            const currentTimeSec = currentTimeMin * 60 + clockS;

            animTop.update(dt, currentTimeSec);
            animBottom.update(dt, currentTimeSec);
            window._updateLaufwegDot();
            
            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);

        // --- Fahrplan tables exposed globally after load ---
        // window._fahrplanMap, window._zuegeMap set inside loadFahrplan()

        // --- Global Filter State ---
        const activeGattungen = new Set(); // empty = all pass
        let stationFilterText = '';

        function trainMatches(z) {
            if (activeGattungen.size > 0) {
                const g = z.gattung;
                // FDt button is grouped with FD
                const matchFD = (g === 'FD' || g === 'FDt') && activeGattungen.has('FD');
                const matchOther = activeGattungen.has(g);
                if (!matchFD && !matchOther) return false;
            }
            if (stationFilterText) {
                const rows = (window._fahrplanMap || {})[z.rawZugNr] || [];
                const t = stationFilterText.toLowerCase();
                if (!rows.some(r => r.bahnhof.toLowerCase().includes(t))) return false;
            }
            return true;
        }

        function applyFilters() {
            const ahb = (window._nachAhbZuege || []).filter(trainMatches);
            const hal = (window._nachHalleZuege || []).filter(trainMatches);
            document.querySelector('#col1 .col-content').innerHTML = window._createTable ? window._createTable(hal, 1) : '';
            document.querySelector('#col5 .col-content').innerHTML = window._createTable ? window._createTable(ahb, 5) : '';
            // Update active gattung button styles across all filter rows
            document.querySelectorAll('.gat-btn').forEach(btn => {
                const g = btn.dataset.gattung;
                btn.classList.toggle('active', activeGattungen.has(g));
            });
        }

        // Build filter rows for all 5 areas
        function buildFilterRows() {
            const gattungen = [
                { key: 'FD', label: 'FD', cls: 'gat-fd' },
                { key: 'D',  label: 'D',  cls: 'gat-d'  },
                { key: 'E',  label: 'E',  cls: 'gat-e'  },
                { key: 'P',  label: 'P',  cls: 'gat-p'  }
            ];

            [1, 5].forEach(n => {
                const row = document.getElementById(`filter-row-${n}`);
                if (!row) return;
                const isRight = n === 5;

                let html = '';
                if (!isRight) {
                    html += `<button class="filter-reset" onclick="resetAllFilters()" title="Filter zurücksetzen">&#10006;</button>`;
                    gattungen.forEach(g => {
                        html += `<button class="gat-btn ${g.cls}" data-gattung="${g.key}" onclick="toggleGattung('${g.key}')">${g.label}</button>`;
                    });
                    html += `<input type="text" class="station-filter-input" placeholder="Bahnhof…" oninput="setStationFilter(this.value)" id="sf-${n}"/>`;
                } else {
                    html += `<input type="text" class="station-filter-input" placeholder="Bahnhof…" oninput="setStationFilter(this.value)" id="sf-${n}"/>`;
                    gattungen.forEach(g => {
                        html += `<button class="gat-btn ${g.cls}" data-gattung="${g.key}" onclick="toggleGattung('${g.key}')">${g.label}</button>`;
                    });
                    html += `<button class="filter-reset" onclick="resetAllFilters()" title="Filter zurücksetzen">&#10006;</button>`;
                }
                row.innerHTML = html;
            });
        }
        buildFilterRows();

        window.toggleGattung = function(g) {
            if (activeGattungen.has(g)) activeGattungen.delete(g);
            else activeGattungen.add(g);
            // sync all text inputs (keep same value)
            applyFilters();
        };

        window.setStationFilter = function(val) {
            stationFilterText = val.trim();
            // Sync all station filter inputs
            document.querySelectorAll('.station-filter-input').forEach(inp => { inp.value = val; });
            applyFilters();
        };

        window.resetAllFilters = function() {
            activeGattungen.clear();
            stationFilterText = '';
            document.querySelectorAll('.station-filter-input').forEach(inp => { inp.value = ''; });
            applyFilters();
        };

        // Remove old direction filter code (replaced by gattung/text filter above)

    </script>
</body>
