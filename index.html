<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRG39 - Zugvorschau</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --track-color: #333;
            --resizer-color: #ccc;
            --signal-red: #ff4c4c;
            --signal-green: #4cff4c;
            --preview-scale: 1;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        #stellwerk-area {
            height: 50vh;
            min-height: 100px;
            background-color: #e8e8e8;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #stellwerk-controls {
            padding: 5px 20px;
            background-color: #d0d0d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid #bbb;
        }

        #stellwerk-content {
            flex-grow: 1;
            transform-origin: top left;
            position: relative;
            overflow: auto; /* Allow scrolling if zoomed */
        }

        #resizer-top {
            height: 10px;
            background-color: var(--resizer-color);
            cursor: ns-resize;
            border-top: 1px solid #aaa;
            border-bottom: 1px solid #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        #resizer-top::before {
            content: "|||";
            font-size: 8px;
            color: #666;
            transform: rotate(90deg);
            letter-spacing: 1px;
        }

        #main-area {
            flex: 1 1 0;
            background-color: #ffffff;
            min-height: 50px;
            display: flex;
        }

        #four-cols-container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff;
        }

        .col-pane {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
        }

        .col-resizer {
            width: 10px;
            background-color: var(--resizer-color);
            cursor: ew-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            border-left: 1px solid #aaa;
            border-right: 1px solid #aaa;
        }

        .col-resizer::before {
            content: "|||";
            font-size: 8px;
            color: #666;
            letter-spacing: 1px;
        }

        .col-header {
            background-color: #d0d0d0;
            border-bottom: 1px solid #bbb;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .col-header-row1 {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            gap: 5px;
            min-height: 28px;
            white-space: nowrap;
            overflow: hidden;
        }

        .col-header-row1.space-between { justify-content: space-between; }
        .col-header-row1.flex-end      { justify-content: flex-end; }
        .col-header-row1.center        { justify-content: center; }

        .col-header-row2 {
            display: flex;
            align-items: center;
            padding: 3px 6px;
            gap: 4px;
            border-top: 1px solid #bbb;
            background-color: #d8d8d8;
            min-height: 24px;
        }

        .col-header-row2.flex-end { justify-content: flex-end; }

        .col-tab {
            padding: 3px 8px;
            background-color: #e8e8e8;
            border: 1px solid #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-weight: normal;
            font-size: 13px;
        }

        .col-tab.active {
            background-color: #fff;
            border-color: #888;
            font-weight: bold;
            box-shadow: 0 0 4px rgba(0,0,0,0.1);
        }

        .col-content {
            flex-grow: 1;
            background-color: #fff;
            overflow: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        #col3-map {
            width: 100%;
            height: 100%;
        }

        /* Gattung filter buttons */
        .gat-btn {
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #aaa;
            cursor: pointer;
            background: #eee;
            font-weight: bold;
        }
        .gat-btn:hover { filter: brightness(0.9); }
        .gat-btn.active { outline: 2px solid #333; }
        .gat-fd  { color: #800080; }
        .gat-d   { color: #d32f2f; }
        .gat-e   { color: #1976d2; }
        .gat-p   { color: #555; }

        .station-filter-input {
            font-size: 12px;
            border: 1px solid #aaa;
            border-radius: 3px;
            padding: 1px 4px;
            width: 80px;
            flex-shrink: 1;
            min-width: 40px;
        }

        .fahrplan-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .fahrplan-table th, .fahrplan-table td {
            border-bottom: 1px solid #ccc;
            padding: 4px;
            text-align: left;
        }
        
        .fahrplan-table th {
            background-color: #f0f0f0;
            position: sticky;
            top: -10px;
            z-index: 5;
        }
        
        .fahrplan-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .fahrplan-table tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        .fahrplan-table tbody tr {
            cursor: pointer;
        }

        .fahrplan-table tbody tr:hover {
            background-color: #e6f7ff !important;
        }

        .fahrplan-table tbody tr.selected {
            background-color: #cceeff !important;
        }
        
        .fahrplan-table tbody tr.next-train {
            background-color: #fffacd !important;
        }

        .fahrplan-table tbody tr.next-train.selected {
            background-color: #cceeff !important; /* Selection overrides next-train color */
        }

        .gattung-fd { color: #800080; } /* Lila */
        .gattung-d { color: #d32f2f; } /* Rot */
        .gattung-e { color: #1976d2; } /* Blau */

        #resizer {
            height: 10px;
            background-color: var(--resizer-color);
            cursor: ns-resize;
            border-top: 1px solid #aaa;
            border-bottom: 1px solid #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #resizer::before {
            content: "|||";
            font-size: 8px;
            color: #666;
            transform: rotate(90deg);
            letter-spacing: 1px;
        }

        #preview-area {
            height: 250px;
            min-height: 100px;
            background-color: #e0e0e0;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #controls-bar {
            padding: 5px 20px;
            background-color: #d0d0d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid #bbb;
        }
        .controls-left, .controls-right {
            display: flex;
            gap: 15px;
            align-items: center;
            flex: 1;
        }
        .controls-right {
            justify-content: flex-end;
        }
        .controls-center {
            display: flex;
            gap: 25px;
            align-items: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .clock-part {
            cursor: ns-resize;
            display: inline-block;
            padding: 0 2px;
            border-radius: 3px;
        }
        .clock-part:hover {
            background-color: rgba(0,0,0,0.1);
        }
        .fw-bold {
            font-weight: bold;
        }

        #tracks-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 20px 0 70px 0;
        }

        .track-container {
            position: relative;
            width: 100%;
            height: calc(60px * var(--preview-scale)); /* Space for train */
        }

        .track {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 3px;
            background-color: var(--track-color);
        }

        /* Signals */
        .signal {
            position: absolute;
            bottom: -13.5px; /* Centered on track (track is 3px at bottom 0, signal is 30px high) */
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 20;
            clip-path: polygon(100% 50%, 0 0, 0 100%);
            transition: background-color 0.3s;
        }

        #signal-top {
            left: 50px;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }

        #signal-bottom {
            right: 50px;
            clip-path: polygon(100% 50%, 0 0, 0 100%);
        }

        .halt { background-color: var(--signal-red); }
        .fahrt { background-color: var(--signal-green); }

        /* Route Labels & Countdowns */
        .route-label {
            position: absolute;
            bottom: -20px;
            font-size: 12px;
            color: #333;
            font-weight: 500;
            white-space: nowrap;
        }
        .countdown-label {
            position: absolute;
            bottom: -20px;
            font-size: 12px;
            color: #555;
            font-weight: bold;
            font-style: italic;
            white-space: nowrap;
        }
        /* Top track: apex at left:80px — route to the right, countdown to the left */
        #route-top {
            left: 96px;
            text-align: left;
        }
        #countdown-top {
            right: calc(100% - 64px);
            text-align: right;
        }
        /* Bottom track: apex at right:80px — route to the left, countdown to the right */
        #route-bottom {
            right: 96px;
            text-align: right;
        }
        #countdown-bottom {
            left: calc(100% - 64px);
            text-align: left;
        }


        /* Train type colors for signal info */
        .sig-gat-fd { color: #800080; }
        .sig-gat-d  { color: #d32f2f; }
        .sig-gat-e  { color: #1976d2; }
        .sig-gat-p  { color: #222; }

        /* Trains */
        .train {
            position: absolute;
            bottom: 3px; /* On track (track is 3px high) */
            display: flex;
            align-items: flex-end;
            white-space: nowrap;
            z-index: 10; /* Behind signals (z-index 20) */
        }

        .vehicle {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            position: absolute;
            top: 100%;
            padding-top: 5px;
            font-size: calc(10px * var(--preview-scale));
            color: #555;
            white-space: nowrap;
            display: none;
        }

        body.show-info .info-label {
            display: block;
        }

        .train img {
            height: calc(40px * var(--preview-scale)); /* Adjust based on image aspect ratio later */
            display: block;
            margin: 0;
            padding: 0;
            object-fit: contain;
            object-position: bottom;
        }

        /* Top train goes left */
        #train-top {
            transform-origin: center bottom;
        }

    </style>
</head>
<body>

    <div id="stellwerk-area">
        <div id="stellwerk-controls">
            <div style="flex: 1; display: flex; align-items: center;"><strong>Stellwerk</strong></div>
            <div style="flex: 1; display: flex; justify-content: center;">
                <button id="fullscreen-btn" style="padding: 3px 12px; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; background: #e8e8e8;">Vollbild</button>
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center;">
                <label>Zoom: <input type="range" id="stellwerk-zoom" min="0.1" max="3" step="0.1" value="1"></label>
            </div>
        </div>
        <div id="stellwerk-content">
            <!-- Stellwerk Inhalt -->
        </div>
    </div>
    <div id="resizer-top"></div>
    <div id="main-area">
        <div id="four-cols-container">
            <!-- Bereich 1: v/n Halle (Ankunft) -->
            <div class="col-pane" id="col1">
                <div class="col-header">
                    <div class="col-header-row1 space-between">
                        <span>&larr; nach Halle</span>
                    </div>
                    <div class="col-header-row2" id="filter-row-1"></div>
                </div>
                <div class="col-content"></div>
            </div>
            <div class="col-resizer" id="res1"></div>
            <!-- Bereich 2: Laufweg/Zp links -->
            <div class="col-pane" id="col2">
                <div class="col-header">
                    <div class="col-header-row1">
                        <span class="col-tab active" data-tab="laufweg" onclick="switchTab(2, 'laufweg')">Laufweg</span>
                        <span class="col-tab" data-tab="zp" onclick="switchTab(2, 'zp')">Zp</span>
                        <span id="info-col2" style="font-weight:normal;font-size:12px;color:#444;margin-left:6px;white-space:nowrap;overflow:hidden;"></span>
                    </div>
                </div>
                <div class="col-content"></div>
            </div>
            <div class="col-resizer" id="res2"></div>
            <!-- Bereich 3: Karte -->
            <div class="col-pane" id="col3">
                <div class="col-header">
                    <div class="col-header-row1 center"><strong>Karte</strong></div>
                </div>
                <div class="col-content" style="padding:0;">
                    <div id="col3-map"></div>
                </div>
            </div>
            <div class="col-resizer" id="res3"></div>
            <!-- Bereich 4: Laufweg/Zp rechts -->
            <div class="col-pane" id="col4">
                <div class="col-header">
                    <div class="col-header-row1 flex-end">
                        <span id="info-col4" style="font-weight:normal;font-size:12px;color:#444;margin-right:6px;white-space:nowrap;overflow:hidden;"></span>
                        <span class="col-tab" data-tab="zp" onclick="switchTab(4, 'zp')">Zp</span>
                        <span class="col-tab active" data-tab="laufweg" onclick="switchTab(4, 'laufweg')">Laufweg</span>
                    </div>
                </div>
                <div class="col-content"></div>
            </div>
            <div class="col-resizer" id="res4"></div>
            <!-- Bereich 5: v/n Ahb (Abfahrt) -->
            <div class="col-pane" id="col5">
                <div class="col-header">
                    <div class="col-header-row1 flex-end">
                        <span>nach Ahb &rarr;</span>
                    </div>
                    <div class="col-header-row2 flex-end" id="filter-row-5"></div>
                </div>
                <div class="col-content"></div>
            </div>
        </div>
    </div>
    <div id="resizer"></div>
    <div id="preview-area">
        <div id="controls-bar">
            <div class="controls-left">
                <label><input type="radio" name="view-mode" value="schematic" checked> Schematisch</label>
                <label><input type="radio" name="view-mode" value="real"> Realzug</label>
                <label><input type="radio" name="view-mode" value="model"> Modellzug</label>
            </div>
            
            <div class="controls-center">
                <select id="station-select" style="margin-right: 15px; font-size: 14px; padding: 2px;">
                    <option value="Berlin Anhalter Bf">Berlin Anhalter Bf</option>
                    <option value="Berlin-Lichterfelde Ost" selected>Berlin-Lichterfelde Ost</option>
                </select>
                <div id="clock-widget" style="display: flex; align-items: center; gap: 5px;">
                    <svg id="icon-clock" style="cursor: pointer;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span><span class="clock-part fw-bold" id="clock-h">12</span>.<span class="clock-part fw-bold" id="clock-m">00</span>:<span class="clock-part" id="clock-s">00</span></span>
                </div>
                <div id="multiplier-widget" style="display: flex; align-items: center; gap: 5px;">
                    <svg id="icon-mul" style="cursor: pointer;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon></svg>
                    <span>Faktor <span class="clock-part" id="mul-container">1:<span id="clock-mul">1</span></span></span>
                </div>
            </div>

            <div class="controls-right">
                <label><input type="checkbox" id="info-checkbox"> Wageninformation</label>
            </div>
        </div>
        <div id="tracks-area">
            <div class="track-container" id="track-top-container">
                <div id="countdown-top" class="countdown-label"></div>
                <div class="track"></div>
                <div id="signal-top" class="signal halt"></div>
                <div id="route-top" class="route-label"></div>
                <div id="train-top" class="train"></div>
            </div>
            
            <div class="track-container" id="track-bottom-container">
                <div id="countdown-bottom" class="countdown-label"></div>
                <div class="track"></div>
                <div id="signal-bottom" class="signal fahrt"></div>
                <div id="route-bottom" class="route-label"></div>
                <div id="train-bottom" class="train"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Clock Logic ---
        let simTime = new Date();
        let clockH = simTime.getHours();
        let clockM = simTime.getMinutes();
        let clockS = simTime.getSeconds();
        let timeMul = 1;

        function updateClockDisplay() {
            document.getElementById('clock-h').textContent = String(clockH).padStart(2, '0');
            document.getElementById('clock-m').textContent = String(clockM).padStart(2, '0');
            document.getElementById('clock-s').textContent = String(clockS).padStart(2, '0');
            document.getElementById('clock-mul').textContent = timeMul;
            if (typeof window.autoSelectNextTrain === 'function') {
                window.autoSelectNextTrain();
            }
            if (typeof window.updateSignalTrainInfo === 'function') {
                window.updateSignalTrainInfo();
            }
        }
        updateClockDisplay();

        function attachScrollHandler(id, callback) {
            document.getElementById(id).addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = Math.sign(e.deltaY);
                callback(delta < 0 ? 1 : -1);
                updateClockDisplay();
            });
        }

        attachScrollHandler('clock-h', (change) => {
            clockH = (clockH + change + 24) % 24;
        });
        attachScrollHandler('clock-m', (change) => {
            clockM = (clockM + change + 60) % 60;
        });
        attachScrollHandler('clock-s', (change) => {
            clockS = (clockS + change + 60) % 60;
        });
        attachScrollHandler('mul-container', (change) => {
            timeMul += change;
            if (timeMul < 1) timeMul = 1;
            if (timeMul > 20) timeMul = 20;
        });

        document.getElementById('icon-clock').addEventListener('click', () => {
            const now = new Date();
            clockH = now.getHours();
            clockM = now.getMinutes();
            clockS = now.getSeconds();
            updateClockDisplay();
        });

        document.getElementById('icon-mul').addEventListener('click', () => {
            timeMul = 2;
            updateClockDisplay();
        });

        let lastTime = performance.now();
        let remainderMs = 0;

        function tickSimulation(now) {
            const deltaMs = now - lastTime;
            lastTime = now;
            
            remainderMs += deltaMs * timeMul;
            
            if (remainderMs >= 1000) {
                const secsToadd = Math.floor(remainderMs / 1000);
                remainderMs -= secsToadd * 1000;
                
                clockS += secsToadd;
                if (clockS >= 60) {
                    clockM += Math.floor(clockS / 60);
                    clockS = clockS % 60;
                }
                if (clockM >= 60) {
                    clockH = (clockH + Math.floor(clockM / 60)) % 24;
                    clockM = clockM % 60;
                }
                updateClockDisplay();
            }
            requestAnimationFrame(tickSimulation);
        }
        requestAnimationFrame(tickSimulation);

        // --- Unified Mouse Handlers for all resizers ---
        let isResizingTop = false;
        let isResizingBottom = false;
        let isResizingCol = false;

        const resizerTop = document.getElementById('resizer-top');
        const stellwerkArea = document.getElementById('stellwerk-area');

        resizerTop.addEventListener('mousedown', (e) => {
            isResizingTop = true;
            document.body.style.cursor = 'ns-resize';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (isResizingTop) {
                const newHeight = e.clientY;
                if (newHeight > 50 && newHeight < window.innerHeight - 100) {
                    stellwerkArea.style.height = newHeight + 'px';
                    if (window._orm_map) window._orm_map.invalidateSize();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            if (isResizingTop) {
                isResizingTop = false;
                document.body.style.cursor = 'default';
            }
        });

        // --- Stellwerk Zoom Logic ---
        const stellwerkZoom = document.getElementById('stellwerk-zoom');
        const stellwerkContent = document.getElementById('stellwerk-content');
        stellwerkZoom.addEventListener('input', (e) => {
            const scale = e.target.value;
            stellwerkContent.style.transform = `scale(${scale})`;
        });

        // --- 5 Columns Logic ---
        // Layout: col1 | res1 | col2 | res2 | col3(Karte) | res3 | col4 | res4 | col5
        // Symmetry: col1=col5 (outer pair), col2=col4 (inner pair), col3(Karte) absorbs.
        const _c1 = document.getElementById('col1');
        const _c2 = document.getElementById('col2');
        const _c3 = document.getElementById('col3');
        const _c4 = document.getElementById('col4');
        const _c5 = document.getElementById('col5');
        const _r1 = document.getElementById('res1');
        const _r2 = document.getElementById('res2');
        const _r3 = document.getElementById('res3');
        const _r4 = document.getElementById('res4');

        let a1 = 15, a2 = 20, a3 = 30, a4 = 20, a5 = 15; // percentages (a3 = Karte)

        function updateCols() {
            _c1.style.width = a1 + '%';
            _c2.style.width = a2 + '%';
            _c3.style.width = a3 + '%';
            _c4.style.width = a4 + '%';
            _c5.style.width = a5 + '%';
        }
        updateCols();

        let activeColResizer = null;
        let colStartX = 0;
        let sa1, sa2, sa3, sa4, sa5;

        function startColResize(e, id) {
            activeColResizer = id;
            colStartX = e.clientX;
            sa1 = a1; sa2 = a2; sa3 = a3; sa4 = a4; sa5 = a5;
            document.body.style.cursor = 'ew-resize';
            e.preventDefault();
        }

        _r1.addEventListener('mousedown', e => startColResize(e, 'r1'));
        _r2.addEventListener('mousedown', e => startColResize(e, 'r2'));
        _r3.addEventListener('mousedown', e => startColResize(e, 'r3'));
        _r4.addEventListener('mousedown', e => startColResize(e, 'r4'));

        window.addEventListener('mousemove', e => {
            if (!activeColResizer) return;
            const cw = document.getElementById('four-cols-container').clientWidth;
            const d = ((e.clientX - colStartX) / cw) * 100;
            const MIN = 5;

            if (activeColResizer === 'r1') {
                // outer-left: a1 & a5 grow/shrink symmetrically, a3 absorbs
                let n1 = Math.max(MIN, Math.min(sa1 + d, 40));
                let n3 = 100 - 2 * n1 - 2 * sa2;
                if (n3 >= MIN) { a1 = n1; a5 = n1; a3 = n3; }
            } else if (activeColResizer === 'r4') {
                // outer-right: mirror of r1 (moving right shrinks a5)
                let n5 = Math.max(MIN, Math.min(sa5 - d, 40));
                let n3 = 100 - 2 * n5 - 2 * sa2;
                if (n3 >= MIN) { a5 = n5; a1 = n5; a3 = n3; }
            } else if (activeColResizer === 'r2') {
                // inner-left: a2 & a4 grow/shrink symmetrically, a3 absorbs
                let n2 = Math.max(MIN, Math.min(sa2 + d, 35));
                let n3 = 100 - 2 * sa1 - 2 * n2;
                if (n3 >= MIN) { a2 = n2; a4 = n2; a3 = n3; }
            } else if (activeColResizer === 'r3') {
                // inner-right: mirror of r2 (moving right shrinks a4)
                let n4 = Math.max(MIN, Math.min(sa4 - d, 35));
                let n3 = 100 - 2 * sa1 - 2 * n4;
                if (n3 >= MIN) { a4 = n4; a2 = n4; a3 = n3; }
            }
            updateCols();
            if (window._orm_map) window._orm_map.invalidateSize();
        });

        // --- OpenRailwayMap (Leaflet) ---
        // Berlin Anhalter Bf: 52.5029N, 13.3826E

            const mapEl = document.getElementById('col3-map');

            }).addTo(map);

            map.whenReady(() => {

                // Pan DOWN by 30% of map height to push station UP.

        // --- Fahrplan Logic ---
        async function loadFahrplan() {
            try {
                const [zuegeRes, abfahrtenRes, zpaRes] = await Promise.all([
                    fetch('data/fahrplan/zuege.txt'),
                    fetch('data/fahrplan/abfahrten.txt'),
                    fetch('data/fahrplan/zpa.txt')
                ]);
                
                if (!zuegeRes.ok || !abfahrtenRes.ok || !zpaRes.ok) {
                    throw new Error("Fahrplandaten konnten nicht geladen werden.");
                }

                // Decode as ISO-8859-1 / Windows-1252 to fix Umlauts
                const decoder = new TextDecoder('windows-1252');
                const zuegeBuffer = await zuegeRes.arrayBuffer();
                const abfahrtenBuffer = await abfahrtenRes.arrayBuffer();
                const zpaBuffer = await zpaRes.arrayBuffer();

                const zuegeText = decoder.decode(zuegeBuffer);
                const abfahrtenText = decoder.decode(abfahrtenBuffer);
                const zpaText = decoder.decode(zpaBuffer);

                // Parse zuege.txt
                const zuegeLines = zuegeText.split('\n');
                const zuegeMap = {};
                for (let i = 1; i < zuegeLines.length; i++) {
                    const line = zuegeLines[i].trim();
                    if (!line) continue;
                    const cols = line.split('\t');
                    if (cols.length >= 2) {
                        zuegeMap[cols[1].trim()] = cols[0].trim();
                    }
                }

                // Parse abfahrten.txt
                const abfahrtenLines = abfahrtenText.split('\n');
                const fahrplanMap = {};
                for (let i = 1; i < abfahrtenLines.length; i++) {
                    const line = abfahrtenLines[i].trim();
                    if (!line) continue;
                    const cols = line.split('\t');
                    if (cols.length >= 4) {
                        const zugNr = cols[0].trim();
                        if (!fahrplanMap[zugNr]) fahrplanMap[zugNr] = [];
                        fahrplanMap[zugNr].push({
                            ankunft: cols[1].trim(),
                            abfahrt: cols[2].trim(),
                            bahnhof: cols[3].trim()
                        });
                    }
                }

                // Parse zpa.txt
                const zpaLines = zpaText.split('\n');
                const zpaMap = {};
                for (let i = 1; i < zpaLines.length; i++) {
                    // Do NOT trim before split - trailing tabs mark empty last columns
                    const rawLine = zpaLines[i].replace(/\r$/, '');
                    if (!rawLine.trim()) continue;
                    const cols = rawLine.split('\t');
                    if (cols.length >= 9) {
                        const zugNr = cols[0].trim();
                        if (!zpaMap[zugNr]) zpaMap[zugNr] = [];
                        zpaMap[zugNr].push({
                            gattung: cols[1].trim(),
                            vonZug: (cols[4] || '').trim(),
                            vonBf: (cols[5] || '').trim(),
                            nachBf: (cols[6] || '').trim(),
                            nachZug: (cols[7] || '').trim(),
                            umlPl: (cols[8] || '').trim(),
                            anmerkung: (cols[9] || '').trim()
                        });
                    }
                }

                window._zuegeMap = zuegeMap;
                window._fahrplanMap = fahrplanMap;
                window._zpaMap = zpaMap;

                const nachAhbZuege = [];   // Züge mit Ziel Berlin Anhalter Bf (kommen von Halle)
                const nachHalleZuege = []; // Züge ab Berlin Anhalter Bf (fahren nach Halle/Süden)

                for (const zugNr in fahrplanMap) {
                    const rows = fahrplanMap[zugNr];
                    if (rows.length === 0) continue;
                    
                    const firstRow = rows[0];
                    const lastRow = rows[rows.length - 1];
                    const gattung = zuegeMap[zugNr] || '';
                    const zugName = `${gattung} ${zugNr}`.trim();

                    const timeToMin = (t) => {
                        if (!t) return 9999;
                        const parts = t.split('.');
                        if (parts.length === 2) {
                            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
                        }
                        return 9999;
                    };

                    const getZeitString = (row) => {
                        const ank = row.ankunft;
                        const abf = row.abfahrt;
                        if (ank && abf) return `${ank} - ${abf}`;
                        if (ank) return ank;
                        if (abf) return abf;
                        return "";
                    };

                    if (lastRow.bahnhof === "Berlin Anhalter Bf") {
                        nachAhbZuege.push({
                            rawZugNr: zugNr,
                            zug: zugName,
                            zeit: getZeitString(lastRow),
                            zeitMin: timeToMin(lastRow.ankunft || lastRow.abfahrt),
                            vonNach: firstRow.bahnhof,
                            gattung: gattung
                        });
                    } else if (firstRow.bahnhof === "Berlin Anhalter Bf") {
                        nachHalleZuege.push({
                            rawZugNr: zugNr,
                            zug: zugName,
                            zeit: getZeitString(firstRow),
                            zeitMin: timeToMin(firstRow.abfahrt || firstRow.ankunft),
                            vonNach: lastRow.bahnhof,
                            gattung: gattung
                        });
                    }
                }

                nachAhbZuege.sort((a, b) => a.zeitMin - b.zeitMin);
                nachHalleZuege.sort((a, b) => a.zeitMin - b.zeitMin);

                // Store globally for filter access
                window._nachAhbZuege = nachAhbZuege;
                window._nachHalleZuege = nachHalleZuege;

                window._createTable = function createTable(zuege, area) {
                    let html = '<table class="fahrplan-table">';
                    html += `<thead><tr><th>Zug</th><th>Zeit</th><th>${area === 1 ? 'Nach' : 'Von'}</th></tr></thead><tbody>`;
                    zuege.forEach(z => {
                        let colorClass = '';
                        if (z.gattung === 'FD' || z.gattung === 'FDt') colorClass = 'gattung-fd';
                        else if (z.gattung === 'D') colorClass = 'gattung-d';
                        else if (z.gattung === 'E') colorClass = 'gattung-e';
                        
                        html += `<tr class="${colorClass}" data-zugnr="${z.rawZugNr}" onclick="window.selectTrain('${z.rawZugNr}', ${area}, this)">
                            <td>${z.zug}</td>
                            <td>${z.zeit}</td>
                            <td style="text-align:${area === 1 ? 'left' : 'right'};">${z.vonNach}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                    return html;
                };

                // col1 = nach Halle (left column), col5 = nach Ahb (right column)
                document.querySelector('#col1 .col-content').innerHTML = window._createTable(nachHalleZuege, 1);
                document.querySelector('#col5 .col-content').innerHTML = window._createTable(nachAhbZuege, 5);

                window.selectTrain = function(zugNr, area, trElement) {
                    const tbody = trElement.closest('tbody');
                    tbody.querySelectorAll('tr').forEach(tr => tr.classList.remove('selected'));
                    trElement.classList.add('selected');

                    const rows = window._fahrplanMap[zugNr];
                    if (!rows) return;

                    const gattung = window._zuegeMap[zugNr] || '';
                    const zugName = `${gattung} ${zugNr}`.trim();
                    const firstRow = rows[0];
                    const lastRow = rows[rows.length - 1];

                    if (area === 1) {
                        // nach Halle: Zug fährt von Ahb weg
                        document.getElementById('info-col2').textContent = `${zugName} nach ${lastRow.bahnhof}`;
                    } else if (area === 5) {
                        // nach Ahb: Zug kommt von Halle
                        document.getElementById('info-col4').textContent = `${zugName} von ${firstRow.bahnhof}`;
                    }

                    const targetArea = area === 1 ? 2 : 4;
                    const tState = tabState[targetArea];

                    // Laufweg HTML
                    let lwHtml = `<div class="content-laufweg" style="display:${tState === 'laufweg' ? 'block' : 'none'}">`;
                    lwHtml += '<table class="fahrplan-table">';
                    lwHtml += '<thead><tr><th>Ankunft</th><th>Abfahrt</th><th>Bahnhof</th></tr></thead><tbody>';
                    for (const r of rows) {
                        lwHtml += `<tr><td>${r.ankunft}</td><td>${r.abfahrt}</td><td>${r.bahnhof}</td></tr>`;
                    }
                    lwHtml += '</tbody></table></div>';

                    // Zp HTML
                    const zpRows = window._zpaMap[zugNr] || [];
                    let zpHtml = `<div class="content-zp" style="display:${tState === 'zp' ? 'block' : 'none'}; height:100%;">`;
                    if (zpRows.length === 0) {
                        zpHtml += '<div style="display:flex; justify-content:center; align-items:center; height:100%; font-style:italic; color:#888;">kein Zp vorhanden</div>';
                    } else {
                        zpHtml += '<table class="fahrplan-table" style="font-size:11px;">';
                        zpHtml += '<thead><tr><th>#</th><th>Gattung</th><th>von Zug</th><th>von Bf</th><th>nach Zug</th><th>nach Bf</th><th>Uml.Pl</th><th>Anmerkung</th></tr></thead><tbody>';
                        zpRows.forEach((r, i) => {
                            zpHtml += `<tr><td>${i+1}</td><td>${r.gattung}</td><td>${r.vonZug}</td><td>${r.vonBf}</td><td>${r.nachZug}</td><td>${r.nachBf}</td><td>${r.umlPl}</td><td>${r.anmerkung}</td></tr>`;
                        });
                        zpHtml += '</tbody></table>';
                    }
                    zpHtml += '</div>';

                    const finalHtml = lwHtml + zpHtml;

                    if (area === 1) {
                        document.querySelector('#col2 .col-content').innerHTML = finalHtml;
                    } else if (area === 5) {
                        document.querySelector('#col4 .col-content').innerHTML = finalHtml;
                    }
                };

            } catch (err) {
                console.error("Fehler beim Laden des Fahrplans:", err);
                const errorMsg = `<div style="color:red;padding:10px;">Fehler: ${err.message}</div>`;
                document.querySelector('#col1 .col-content').innerHTML = errorMsg;
                document.querySelector('#col5 .col-content').innerHTML = errorMsg;
            }
        }
        
        window._currentNextTrain = { 1: null, 5: null };

        loadFahrplan().then(() => {
            if (typeof window.autoSelectNextTrain === 'function') {
                window.autoSelectNextTrain();
            }
        });

        window.autoSelectNextTrain = function() {
            const sel = document.getElementById('station-select');
            const station = sel ? sel.value : 'Berlin-Lichterfelde Ost';
            const offsetLinks = (station === 'Berlin-Lichterfelde Ost') ? -7 : 0; // links = Züge Richtung Ahb, LiOst ist 7min früher
            const offsetRechts = (station === 'Berlin-Lichterfelde Ost') ? +7 : 0; // rechts = Züge weg von Ahb, LiOst ist 7min später
            const currentTime = clockH * 60 + clockM;
            
            const findNext = (zuege, area) => {
                const offset = area === 1 ? offsetLinks : offsetRechts;
                const localTime = currentTime - offset; // convert local time back to Ahb-based time for comparison
                let nextZug = null;
                for (const z of zuege) {
                    if (z.zeitMin >= localTime) {
                        nextZug = z;
                        break;
                    }
                }
                if (!nextZug && zuege.length > 0) nextZug = zuege[0];
                
                if (nextZug) {
                    const colId = area === 1 ? 'col1' : 'col5';
                    const tr = document.querySelector(`#${colId} tr[data-zugnr="${nextZug.rawZugNr}"]`);
                    
                    if (tr) {
                        document.querySelectorAll(`#${colId} tr.next-train`).forEach(el => el.classList.remove('next-train'));
                        tr.classList.add('next-train');
                        
                        if (window._currentNextTrain[area] !== nextZug.rawZugNr) {
                            window._currentNextTrain[area] = nextZug.rawZugNr;
                            
                            // Select it in area 2/4
                            selectTrain(nextZug.rawZugNr, area, tr);
                            
                            // Scroll it to top (approx 30px offset for the sticky header)
                            const container = document.querySelector(`#${colId} .col-content`);
                            container.scrollTo({
                                top: Math.max(0, tr.offsetTop - 30),
                                behavior: 'smooth'
                            });
                        }
                    }
                }
            };

            if (window._nachAhbZuege) findNext(window._nachAhbZuege, 5);
            if (window._nachHalleZuege) findNext(window._nachHalleZuege, 1);
        };

        // --- Signal Train Info ---
        // --- Train Animation & Signal Logic ---
        function getStationOffset(trainsArea) {
            const sel = document.getElementById('station-select');
            const station = sel ? sel.value : 'Berlin-Lichterfelde Ost';
            if (station === 'Berlin Anhalter Bf') return 0;
            // Berlin-Lichterfelde Ost is left (South) of Anh Bf.
            // nachHalleZuege (area 1): depart Ahb going south -> LiOst is 7min later (+7 offset)
            // nachAhbZuege   (area 5): arrive at Ahb from south -> LiOst is 7min earlier (-7 offset)
            if (trainsArea === 1) return +7;
            if (trainsArea === 5) return -7;
            return 0;
        }


        window.updateSignalTrainInfo = function() {
            // UI info update is now handled in the animation loop to ensure smooth countdowns
        };

        class TrainAnimator {
            constructor(isTopTrack, trainId, signalId, routeId, countdownId, area) {
                this.isTopTrack = isTopTrack;
                this.trainEl = document.getElementById(trainId);
                this.signalEl = document.getElementById(signalId);
                this.routeEl = document.getElementById(routeId);
                this.countdownEl = document.getElementById(countdownId);
                this.area = area;
                
                this.frontX = isTopTrack ? window.innerWidth + 100 : -100;
                this.speed = 0;
                this.maxSpeed = 2; // px per frame
                this.acceleration = 0.02;
                this.currentZugNr = null;
                this.sigState = 'fahrt';
                this.width = 100;
            }

            gatClass(g) {
                if (g === 'FD' || g === 'FDt') return 'sig-gat-fd';
                if (g === 'D') return 'sig-gat-d';
                if (g === 'E') return 'sig-gat-e';
                return 'sig-gat-p';
            }

            update(dt, currentTimeSec) {
                const off = getStationOffset(this.area);
                const zuegeList = this.area === 5 ? window._nachAhbZuege : window._nachHalleZuege;
                
                let z = null;
                if (zuegeList) {
                    z = zuegeList.find(t => (t.zeitMin + off) * 60 >= currentTimeSec - 120) || zuegeList[0];
                }
                
                if (!z) {
                    this.trainEl.style.display = 'none';
                    this.routeEl.innerHTML = '';
                    this.countdownEl.textContent = '';
                    return;
                }

                const T_sec = (z.zeitMin + off) * 60;
                let diffSec = T_sec - currentTimeSec; // positive means in future
                if (diffSec > 12 * 3600) diffSec -= 24 * 3600;
                if (diffSec < -12 * 3600) diffSec += 24 * 3600;

                // Update Route & Countdown UI
                const g = z.gattung || '';
                const cls = this.gatClass(g);
                
                // Find next stop from Laufweg
                const sel = document.getElementById('station-select');
                const station = sel ? sel.value : 'Berlin-Lichterfelde Ost';
                const rows = window._fahrplanMap ? (window._fahrplanMap[z.rawZugNr] || []) : [];
                let stopLabel = '';
                if (rows.length > 0) {
                    const ahbName = 'Berlin Anhalter Bf';
                    const liName = 'Berlin-Lichterfelde Ost';
                    const curStation = (station === 'Berlin Anhalter Bf') ? ahbName : liName;
                    let curIdx = rows.findIndex(r => r.bahnhof === curStation);
                    // If station not in Laufweg, use Ahb as reference (LiOst is before Ahb for top, after for bottom)
                    if (curIdx < 0) {
                        curIdx = rows.findIndex(r => r.bahnhof === ahbName);
                    }
                    if (this.isTopTrack) {
                        // Top track: train going LEFT towards Ahb
                        // Next stop = station after current in list (towards Ahb = end of list)
                        if (curIdx >= 0 && curIdx + 1 < rows.length) {
                            stopLabel = ` (nächster Halt: ${rows[curIdx + 1].bahnhof})`;
                        }
                    } else {
                        // Bottom track: train going RIGHT away from Ahb
                        // Next stop = station after Ahb in list
                        if (curIdx >= 0 && curIdx + 1 < rows.length) {
                            stopLabel = ` (nächster Halt: ${rows[curIdx + 1].bahnhof})`;
                        }
                    }
                }
                
                this.routeEl.innerHTML = `${z.zeit}&nbsp;<span class="${cls}"><strong>${z.zug}</strong></span>&nbsp;${z.vonNach}${stopLabel ? `<span style="color:#aaa;font-size:0.9em">${stopLabel}</span>` : ''}`;
                
                const screenW = window.innerWidth;
                const signalX = this.isTopTrack ? 80 : screenW - 80;
                const travelDist = screenW + 20;
                const realTravelTime = travelDist / 120; // 120px per sec
                const simTravelTime = realTravelTime * timeMul;
                
                const stopping = (g === 'P');
                const waitSimTime = stopping ? 60 : 0; // stop for 60 simulated seconds
                const spawnDiffSec = simTravelTime + waitSimTime;
                
                let shouldBeActive = (diffSec <= spawnDiffSec && diffSec >= -120);

                // Countdown Logic (Real time until train front reaches the signal)
                let realTimeToSignal = 0;
                let showCountdown = false;

                if (this.currentZugNr) {
                    let distToSignal = this.isTopTrack ? (this.frontX - signalX) : (signalX - this.frontX);
                    if (distToSignal > 2) {
                        realTimeToSignal = distToSignal / 120;
                        showCountdown = true;
                    }
                } else if (diffSec > 0 && diffSec < 12 * 3600) {
                    let simTimeUntilSpawn = diffSec - spawnDiffSec;
                    if (simTimeUntilSpawn > 0) {
                        realTimeToSignal = (simTimeUntilSpawn / timeMul) + realTravelTime;
                        showCountdown = true;
                    } else {
                        realTimeToSignal = realTravelTime;
                        showCountdown = true;
                    }
                }

                if (showCountdown) {
                    const m = Math.floor(realTimeToSignal / 60);
                    const s = Math.floor(realTimeToSignal % 60);
                    this.countdownEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
                    this.countdownEl.style.display = 'block';
                } else {
                    this.countdownEl.style.display = 'none';
                }

                if (z.rawZugNr !== this.currentZugNr) {
                    if (shouldBeActive) {
                        this.currentZugNr = z.rawZugNr;
                        this.frontX = this.isTopTrack ? screenW + 100 : -100;
                        this.speed = this.maxSpeed;
                        
                        const viewMode = document.querySelector('input[name="view-mode"]:checked')?.value;
                        if (viewMode === 'schematic') {
                            renderSchematicTrain(this.trainEl, z, this.isTopTrack);
                        } else {
                            this.trainEl.innerHTML = '';
                        }
                    } else {
                        this.trainEl.style.display = 'none';
                        return;
                    }
                }
                
                this.width = this.trainEl.getBoundingClientRect().width || 100;
                
                let backX = this.isTopTrack ? this.frontX + this.width : this.frontX - this.width;
                let isOffScreen = this.isTopTrack ? (backX < -100) : (backX > screenW + 100);
                
                if (!shouldBeActive && isOffScreen) {
                    this.trainEl.style.display = 'none';
                    this.currentZugNr = null;
                    return;
                }
                
                this.trainEl.style.display = 'flex';

                if (stopping && diffSec > 0) {
                    this.sigState = 'halt';
                } else {
                    this.sigState = 'fahrt';
                }
                this.signalEl.className = `signal ${this.sigState}`;
                
                let timeScale = dt / 16.66;
                if (timeScale > 5) timeScale = 5; 
                
                let targetX = signalX;

                if (this.isTopTrack) { 
                    if (this.sigState === 'halt' && this.frontX > targetX) {
                        let dist = this.frontX - targetX;
                        let targetSpeed = Math.sqrt(2 * this.acceleration * dist);
                        this.speed = Math.min(this.speed, targetSpeed);
                        if (dist <= 1 && this.speed < 0.5) {
                            this.speed = 0;
                            this.frontX = targetX;
                        }
                    } else {
                        if (this.speed < this.maxSpeed) this.speed += this.acceleration * timeScale;
                        if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
                    }
                    this.frontX -= this.speed * timeScale;
                } else { 
                    if (this.sigState === 'halt' && this.frontX < targetX) {
                        let dist = targetX - this.frontX;
                        let targetSpeed = Math.sqrt(2 * this.acceleration * dist);
                        this.speed = Math.min(this.speed, targetSpeed);
                        if (dist <= 1 && this.speed < 0.5) {
                            this.speed = 0;
                            this.frontX = targetX;
                        }
                    } else {
                        if (this.speed < this.maxSpeed) this.speed += this.acceleration * timeScale;
                        if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
                    }
                    this.frontX += this.speed * timeScale;
                }

                let leftPos = this.isTopTrack ? this.frontX : (this.frontX - this.width);
                this.trainEl.style.left = `${leftPos}px`;
            }
        }

        const animTop = new TrainAnimator(true, 'train-top', 'signal-top', 'route-top', 'countdown-top', 1);
        const animBottom = new TrainAnimator(false, 'train-bottom', 'signal-bottom', 'route-bottom', 'countdown-bottom', 5);

        let lastAnimTime = performance.now();
        function animationLoop(now) {
            let dt = now - lastAnimTime;
            lastAnimTime = now;
            
            const currentTimeMin = clockH * 60 + clockM;
            const currentTimeSec = currentTimeMin * 60 + clockS;

            animTop.update(dt, currentTimeSec);
            animBottom.update(dt, currentTimeSec);
            
            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);

        // --- Fahrplan tables exposed globally after load ---
        // window._fahrplanMap, window._zuegeMap set inside loadFahrplan()

        // --- Global Filter State ---
        const activeGattungen = new Set(); // empty = all pass
        let stationFilterText = '';

        function trainMatches(z) {
            if (activeGattungen.size > 0) {
                const g = z.gattung;
                // FDt button is grouped with FD
                const matchFD = (g === 'FD' || g === 'FDt') && activeGattungen.has('FD');
                const matchOther = activeGattungen.has(g);
                if (!matchFD && !matchOther) return false;
            }
            if (stationFilterText) {
                const rows = (window._fahrplanMap || {})[z.rawZugNr] || [];
                const t = stationFilterText.toLowerCase();
                if (!rows.some(r => r.bahnhof.toLowerCase().includes(t))) return false;
            }
            return true;
        }

        function applyFilters() {
            const ahb = (window._nachAhbZuege || []).filter(trainMatches);
            const hal = (window._nachHalleZuege || []).filter(trainMatches);
            document.querySelector('#col1 .col-content').innerHTML = window._createTable ? window._createTable(hal, 1) : '';
            document.querySelector('#col5 .col-content').innerHTML = window._createTable ? window._createTable(ahb, 5) : '';
            // Update active gattung button styles across all filter rows
            document.querySelectorAll('.gat-btn').forEach(btn => {
                const g = btn.dataset.gattung;
                btn.classList.toggle('active', activeGattungen.has(g));
            });
        }

        // Build filter rows for all 5 areas
        function buildFilterRows() {
            const gattungen = [
                { key: 'FD', label: 'FD', cls: 'gat-fd' },
                { key: 'D',  label: 'D',  cls: 'gat-d'  },
                { key: 'E',  label: 'E',  cls: 'gat-e'  },
                { key: 'P',  label: 'P',  cls: 'gat-p'  }
            ];

            [1, 5].forEach(n => {
                const row = document.getElementById(`filter-row-${n}`);
                if (!row) return;
                const isRight = n === 5;

                let html = '';
                if (!isRight) {
                    html += `<button class="filter-reset" onclick="resetAllFilters()" title="Filter zurücksetzen">&#10006;</button>`;
                    gattungen.forEach(g => {
                        html += `<button class="gat-btn ${g.cls}" data-gattung="${g.key}" onclick="toggleGattung('${g.key}')">${g.label}</button>`;
                    });
                    html += `<input type="text" class="station-filter-input" placeholder="Bahnhof…" oninput="setStationFilter(this.value)" id="sf-${n}"/>`;
                } else {
                    html += `<input type="text" class="station-filter-input" placeholder="Bahnhof…" oninput="setStationFilter(this.value)" id="sf-${n}"/>`;
                    gattungen.forEach(g => {
                        html += `<button class="gat-btn ${g.cls}" data-gattung="${g.key}" onclick="toggleGattung('${g.key}')">${g.label}</button>`;
                    });
                    html += `<button class="filter-reset" onclick="resetAllFilters()" title="Filter zurücksetzen">&#10006;</button>`;
                }
                row.innerHTML = html;
            });
        }
        buildFilterRows();

        window.toggleGattung = function(g) {
            if (activeGattungen.has(g)) activeGattungen.delete(g);
            else activeGattungen.add(g);
            // sync all text inputs (keep same value)
            applyFilters();
        };

        window.setStationFilter = function(val) {
            stationFilterText = val.trim();
            // Sync all station filter inputs
            document.querySelectorAll('.station-filter-input').forEach(inp => { inp.value = val; });
            applyFilters();
        };

        window.resetAllFilters = function() {
            activeGattungen.clear();
            stationFilterText = '';
            document.querySelectorAll('.station-filter-input').forEach(inp => { inp.value = ''; });
            applyFilters();
        };

        // Remove old direction filter code (replaced by gattung/text filter above)

    </script>
</body>
